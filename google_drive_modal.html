<!-- Modal Google Drive Import -->
<dialog id="googleDriveModal" class="modal">
    <div class="modal-box w-11/12 max-w-5xl">
        <h3 class="font-bold text-lg mb-4">
            <i class="fas fa-google-drive text-info mr-2"></i>
            Importer depuis Google Drive
        </h3>

        <!-- Container de chargement -->
        <div id="googleDriveLoading" class="hidden">
            <div class="flex items-center justify-center py-8">
                <span class="loading loading-spinner loading-lg text-info"></span>
                <span class="ml-3 loading-text">Chargement...</span>
            </div>
        </div>

        <!-- Liste des bases Google Drive -->
        <div id="googleDriveBasesContainer"></div>

        <!-- Navigateur de fichiers Google Drive -->
        <div id="googleDriveBrowserContainer" class="hidden">
            <div class="flex items-center gap-2 mb-4">
                <button onclick="backToGoogleDriveBases()" class="btn btn-sm btn-ghost">
                    <i class="fas fa-arrow-left mr-1"></i>Retour
                </button>
            </div>

            <!-- Structure du dossier (03 COMPTA, fichier .accde, dossier scan) -->
            <div id="googleDriveFilesContainer"></div>

            <!-- Fichier sélectionné -->
            <div id="googleDriveSelectionContainer" class="hidden mt-4"></div>

            <!-- Bouton d'import -->
            <div class="modal-action">
                <button onclick="importFromGoogleDrive()" id="importFromGoogleDriveBtn" class="btn btn-primary" disabled>
                    <i class="fas fa-download mr-2"></i>Importer ce fichier
                </button>
                <button onclick="closeGoogleDriveModal()" class="btn">Annuler</button>
            </div>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button onclick="closeGoogleDriveModal()">close</button>
    </form>
</dialog>
