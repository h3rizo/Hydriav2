components:
  schemas:
    ActivitesParSemaineEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
      description: |-
        * `0` - Aucune
        * `1` - 1 fois/semaine
        * `2` - 2 fois/semaine
        * `3` - 3 fois/semaine
        * `4` - 4 fois/semaine
        * `5` - 5 fois/semaine
        * `6` - 6 fois/semaine
        * `7` - 7 fois/semaine
    AuthIngredient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        default_unit:
          type: string
          default: g
          maxLength: 50
        kcal_per_100g:
