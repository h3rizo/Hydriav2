name: Hydria Terrain - installateur Linux (.deb)

on:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app/HydriaAppAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :shared a une cible androidTarget() -> le SDK Android est requis a la configuration.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Outils de packaging
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot binutils

      - name: Build .deb
        run: chmod +x gradlew && ./gradlew :desktopApp:packageDeb --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hydria-terrain-linux-deb
          path: android_app/HydriaAppAndroid/desktopApp/build/compose/binaries/main/deb/*.deb
