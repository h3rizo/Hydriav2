{% extends "ouvrages/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-3xl border border-rose-200 bg-white p-8 shadow-sm">
    <h1 class="text-3xl font-bold text-slate-900">Supprimer l'ouvrage</h1>
    <p class="mt-3 text-sm text-slate-600">
        Confirmer la suppression de <strong>{{ ouvrage.nom_ouvrage }}</strong>.
    </p>
    <form method="post" class="mt-6 flex gap-2 justify-end">
        {% csrf_token %}
        <a href="{% url 'ouvrages:ouvrage_detail' ouvrage.pk %}" class="btn btn-outline">Annuler</a>
        <button type="submit" class="btn btn-error">Supprimer</button>
    </form>
</div>
{% endblock %}
