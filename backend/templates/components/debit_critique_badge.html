{% if etat %}<a href="{{ url }}" onclick="event.stopPropagation()"
   class="badge badge-sm gap-1 no-underline whitespace-nowrap {% if etat.niveau == 'critique' %}badge-error{% else %}badge-warning{% endif %}"
   title="Débit source {{ etat.debit_l_s|floatformat:3 }} L/s pour un seuil de {{ etat.seuil_l_s|floatformat:3 }} L/s ({{ etat.ratio_pct }} %) — mesure du {{ etat.date_visite }}{% if etat.mode_paiement == 'volume' %}, seuil = débit de pointe{% else %}, seuil forfaitaire 0,05 L/s par BF{% endif %}{% if etat.herite %} — source partagée avec {{ etat.source_ouvrage_nom }}{% endif %}">
    <i class="fas fa-droplet-slash" aria-hidden="true"></i>{% if not compact %}{% if etat.niveau == 'critique' %}Débit critique{% else %}Débit en vigilance{% endif %} · {{ etat.ratio_pct }} %{% endif %}
</a>{% endif %}
