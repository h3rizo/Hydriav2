{% load humanize %}
{# Pastille « dernière importation DiameX » de la navbar compta ; le texte relatif est rafraîchi chaque minute par le JS ci-dessous. #}
<div id="diamex-import-pill" class="hidden md:flex shrink-0 whitespace-nowrap items-center gap-1.5 rounded-full border border-slate-200/80 bg-white/80 px-3 py-1.5 text-xs text-slate-700 shadow-sm" data-diamex-last-import
     {% if last_import %}title="Dernière importation DiameX : {{ last_import|date:'d/m/Y H:i' }}"{% else %}title="Aucune importation DiameX enregistrée"{% endif %}>
    <i class="fas fa-clock-rotate-left"></i>
    <span class="hidden lg:inline">Import DiameX :</span>
    {% if last_import %}
        <time id="diamex-import-time" class="font-semibold" datetime="{{ last_import|date:'c' }}">{{ last_import|naturaltime }}</time>
    {% else %}
        <span class="font-semibold">aucun</span>
    {% endif %}
</div>
{% if last_import %}
<script>
(function () {
    const el = document.getElementById('diamex-import-time');
    if (!el) return;
    const then = new Date(el.getAttribute('datetime')).getTime();
    if (isNaN(then)) return;
    const pill = document.getElementById('diamex-import-pill');
    const plural = (n, unit) => n + ' ' + unit + (n > 1 && unit !== 'mois' ? 's' : '');
    function relative(ms) {
        const m = Math.floor(ms / 60000);
        if (m < 1) return 'à l\'instant';
        if (m < 60) return 'il y a ' + plural(m, 'minute');
        const h = Math.floor(m / 60);
        if (h < 24) return 'il y a ' + plural(h, 'heure');
        const d = Math.floor(h / 24);
        if (d < 30) return 'il y a ' + plural(d, 'jour');
        return 'il y a ' + plural(Math.floor(d / 30), 'mois');
    }
    function tick() {
        const age = Date.now() - then;
        el.textContent = relative(age);
        // Import ancien (> 48 h) : la pastille passe en alerte pour inciter à réimporter.
        pill.classList.toggle('border-warning', age > 48 * 3600 * 1000);
        pill.classList.toggle('text-warning', age > 48 * 3600 * 1000);
    }
    tick();
    setInterval(tick, 60000);
})();
</script>
{% endif %}
