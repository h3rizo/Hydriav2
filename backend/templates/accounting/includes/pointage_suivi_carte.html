{% comment %}
Carte-compteur cliquable du tableau de suivi mensuel.
Paramètres : libelle, valeur, cible (valeur de ?filtre=), ton (error|warning|info|success), icone (classe FA).
Contexte hérité attendu : source, periode, onglet, filtre.
{% endcomment %}
<a href="?source={{ source|urlencode }}&periode={{ periode|urlencode }}&onglet={{ onglet|default:'ligne' }}&filtre={{ cible }}"
   class="card border bg-white/90 shadow-sm transition hover:shadow-md
   {% if filtre == cible %}border-slate-900 ring-1 ring-slate-900{% else %}border-slate-200{% endif %}">
    <div class="card-body gap-1 p-3">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">{{ libelle }}</span>
            <i class="fas {{ icone }}
                {% if ton == 'error' %}text-error{% elif ton == 'warning' %}text-warning{% elif ton == 'success' %}text-emerald-600{% else %}text-cyan-600{% endif %}"></i>
        </div>
        <span class="text-2xl font-bold
            {% if valeur %}{% if ton == 'error' %}text-error{% elif ton == 'warning' %}text-warning{% elif ton == 'success' %}text-emerald-600{% else %}text-slate-900{% endif %}{% else %}text-slate-300{% endif %}">
            {{ valeur|default:0 }}
        </span>
    </div>
</a>
