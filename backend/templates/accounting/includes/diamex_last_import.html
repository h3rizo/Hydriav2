{% load humanize %}
<p class="mt-1 text-sm opacity-80" data-diamex-last-import>
    <i class="fas fa-clock-rotate-left mr-1"></i>
    {% if last_import %}
        Dernière importation DiameX : <span class="font-semibold" title="{{ last_import|date:'d/m/Y H:i' }}">{{ last_import|naturaltime }}</span>
    {% else %}
        Aucune importation DiameX enregistrée
    {% endif %}
</p>
