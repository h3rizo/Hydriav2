{% load humanize %}
{# Sous le libellé : pointage (748411 / 707401) ou recoupement des indemnités (621102). Clic = modal de détail. #}
{% with p=entry.pointage r=entry.rbf_recoupement %}
{% if p %}
<button type="button" onclick="openEntryPointageModal({{ entry.id }})"
        class="mt-1 flex max-w-full flex-wrap items-center gap-1 text-left"
        title="Voir le détail du pointage de cette écriture">
    {% if p.verdict == 'ok' %}
    <span class="badge badge-success badge-outline badge-xs whitespace-nowrap"><i class="fas fa-link mr-1"></i>Pointé · {{ p.source_label }}</span>
    <span class="font-mono text-base-content/70">{{ p.count }} ligne{{ p.count|pluralize }} · {{ p.total|floatformat:0|intcomma }} Ar = écriture</span>
    {% elif p.verdict == 'ecart' %}
    <span class="badge badge-warning badge-xs whitespace-nowrap"><i class="fas fa-triangle-exclamation mr-1"></i>Pointé · écart</span>
    <span class="font-mono text-warning">{{ p.count }} ligne{{ p.count|pluralize }} · {{ p.total|floatformat:0|intcomma }} Ar ({% if p.gap > 0 %}+{% endif %}{{ p.gap|floatformat:0|intcomma }} Ar)</span>
    {% elif p.verdict == 'mauvaise_source' %}
    <span class="badge badge-error badge-xs whitespace-nowrap"><i class="fas fa-triangle-exclamation mr-1"></i>Pointé dans « {{ p.source_label }} »</span>
    <span class="text-error">attendu : {{ p.expected_label }}</span>
    {% else %}
    <span class="badge badge-ghost badge-xs whitespace-nowrap"><i class="fas fa-unlink mr-1"></i>Non pointé</span>
    <span class="text-base-content/60">{{ p.expected_label }}</span>
    {% endif %}
</button>
{% endif %}
{% if r %}
<button type="button" onclick="openEntryPointageModal({{ entry.id }})"
        class="mt-1 flex max-w-full flex-wrap items-center gap-1 text-left"
        title="Recoupement avec le paiement forfaitaire du point d'eau">
    {% if not r.identified %}
    <span class="badge badge-ghost badge-xs whitespace-nowrap"><i class="fas fa-circle-question mr-1"></i>Point non identifié</span>
    {% elif r.status == 'sans_forfait' %}
    <span class="badge badge-error badge-xs whitespace-nowrap"><i class="fas fa-triangle-exclamation mr-1"></i>Aucun forfaitaire pointé ({{ r.year }})</span>
    <span class="font-mono text-error">{{ r.rbf_total|floatformat:0|intcomma }} Ar d'indemnités{% if r.unpointed_units %} · {{ r.unpointed_total|floatformat:0|intcomma }} Ar de forfaitaire non pointé{% endif %}</span>
    {% elif r.status == 'depasse' %}
    <span class="badge badge-error badge-xs whitespace-nowrap"><i class="fas fa-triangle-exclamation mr-1"></i>&gt; {{ r.per_unit|floatformat:0|intcomma }} Ar par forfaitaire ({{ r.year }})</span>
    <span class="font-mono font-bold text-error">{{ r.rbf_total|floatformat:0|intcomma }} / {{ r.allowed|floatformat:0|intcomma }} Ar</span>
    {% else %}
    <span class="badge badge-success badge-outline badge-xs whitespace-nowrap"><i class="fas fa-scale-balanced mr-1"></i>Indemnités ≤ forfaitaire ({{ r.year }})</span>
    <span class="font-mono text-base-content/70">{{ r.rbf_total|floatformat:0|intcomma }} / {{ r.allowed|floatformat:0|intcomma }} Ar</span>
    {% endif %}
    {% if entry.rbf_exercice_decale %}
    <span class="badge badge-info badge-outline badge-xs whitespace-nowrap" title="Le libellé indique l'année {{ entry.rbf_exercice_decale }} : l'indemnité est comptée dans cet exercice, pas dans l'année de la date compta."><i class="fas fa-calendar-check mr-1"></i>Exercice {{ entry.rbf_exercice_decale }} · payé en {{ entry.date_m|date:"Y" }}</span>
    {% endif %}
    {% if r.alert %}
        {% if r.explained %}<span class="badge badge-info badge-outline badge-xs"><i class="fas fa-comment-dots mr-1"></i>Expliqué</span>
        {% else %}<span class="badge badge-error badge-outline badge-xs animate-pulse"><i class="fas fa-circle-question mr-1"></i>Explication requise</span>{% endif %}
    {% endif %}
</button>
{% endif %}
{% endwith %}
