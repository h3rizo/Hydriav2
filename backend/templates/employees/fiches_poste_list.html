{% extends "base.html" %}
{% load static humanize %}

{% block title %}Fiches de poste{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold">Fiches de poste</h1>
            <p class="text-base-content/70">Définir les tâches, descriptions et outils pour chaque poste</p>
        </div>
    </div>

    <!-- Zone d'affichage des fiches -->
    <div id="fichesZone">
        <!-- Bouton ajouter -->
        <div class="mb-4">
            <button onclick="openCreateModal()" class="btn btn-primary">
                <i class="fas fa-plus mr-2"></i>Ajouter une tâche
            </button>
        </div>

        <!-- Liste des fiches -->
        <div id="fichesList" class="space-y-4"></div>
    </div>
</div>

<!-- Modal création/édition -->
<dialog id="modalFiche" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-4" id="modalTitle">Nouvelle tâche</h3>
        <form id="formFiche" class="space-y-4">
            <input type="hidden" id="ficheId">

            <div class="form-control">
                <label class="label"><span class="label-text">Tâche *</span></label>
                <input type="text" id="tache" class="input input-bordered" required>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">Description *</span></label>
                <textarea id="description" class="textarea textarea-bordered h-24" required></textarea>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">Outils nécessaires</span></label>
                <textarea id="outils" class="textarea textarea-bordered h-20"></textarea>
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">Ordre</span></label>
                <input type="number" id="ordre" class="input input-bordered" value="0" min="0">
            </div>

            <div class="modal-action">
                <button type="button" onclick="document.getElementById('modalFiche').close()" class="btn">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>

document.addEventListener('DOMContentLoaded', () => loadFiches());

async function loadFiches() {
    const container = document.getElementById('fichesList');
    container.innerHTML = '<div class="flex justify-center py-4"><span class="loading loading-spinner loading-lg"></span></div>';

    try {
        const response = await fetch('/api/fiches-poste/');
        const data = await response.json();

        if (data.success) {
            displayFiches(data.fiches);
        } else {
            console.error('Erreur API:', data.error);
            container.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-triangle mr-2"></i>Erreur: ${data.error || 'Erreur inconnue'}</div>`;
        }
    } catch (error) {
        console.error('Erreur réseau:', error);
        container.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-triangle mr-2"></i>Erreur de communication avec le serveur. Veuillez vérifier votre connexion et réessayer.</div>';
    }
}

function displayFiches(fiches) {
    const container = document.getElementById('fichesList');

    if (fiches.length === 0) {
        container.innerHTML = `
            <div class="alert alert-info">
                <i class="fas fa-info-circle mr-2"></i>
                <div>
                    <p class="font-semibold">Aucune tâche définie pour ce poste</p>
                    <p class="text-sm">Cliquez sur "Ajouter une tâche" pour commencer à définir les responsabilités de ce poste.</p>
                </div>
            </div>
        `;
        return;
    }

    container.innerHTML = fiches.map(fiche => `
        <div class="card bg-base-200">
            <div class="card-body">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="card-title">${fiche.tache}</h3>
                        <p class="text-sm mt-2">${fiche.description}</p>
                        ${fiche.outils ? `<p class="text-sm text-info mt-2"><i class="fas fa-tools mr-1"></i>${fiche.outils}</p>` : ''}
                        <div class="badge badge-sm mt-2">Ordre: ${fiche.ordre}</div>
                    </div>
                    <div class="dropdown dropdown-end">
                        <label tabindex="0" class="btn btn-ghost btn-sm">
                            <i class="fas fa-ellipsis-v"></i>
                        </label>
                        <ul tabindex="0" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-52">
                            <li><a onclick="openEditModal('${fiche.id}', '${fiche.tache.replace(/'/g, "\\'")}', \`${fiche.description}\`, \`${fiche.outils}\`, ${fiche.ordre})">
                                <i class="fas fa-edit"></i>Modifier
                            </a></li>
                            <li><a onclick="deleteFiche('${fiche.id}', '${fiche.tache.replace(/'/g, "\\'")}')" class="text-error">
                                <i class="fas fa-trash"></i>Supprimer
                            </a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function openCreateModal() {
    document.getElementById('modalTitle').textContent = 'Nouvelle tâche';
    document.getElementById('ficheId').value = '';
    document.getElementById('tache').value = '';
    document.getElementById('description').value = '';
    document.getElementById('outils').value = '';
    document.getElementById('ordre').value = '0';
    document.getElementById('modalFiche').showModal();
}

function openEditModal(id, tache, description, outils, ordre) {
    document.getElementById('modalTitle').textContent = 'Modifier la tâche';
    document.getElementById('ficheId').value = id;
    document.getElementById('tache').value = tache;
    document.getElementById('description').value = description;
    document.getElementById('outils').value = outils;
    document.getElementById('ordre').value = ordre;
    document.getElementById('modalFiche').showModal();
}

document.getElementById('formFiche').addEventListener('submit', async function(e) {
    e.preventDefault();

    const ficheId = document.getElementById('ficheId').value;
    const url = ficheId
        ? `/api/fiches-poste/${ficheId}/update/`
        : '/api/fiches-poste/create/';

    const data = {
        tache: document.getElementById('tache').value,
        description: document.getElementById('description').value,
        outils: document.getElementById('outils').value,
        ordre: parseInt(document.getElementById('ordre').value)
    };

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            document.getElementById('modalFiche').close();
            loadFiches();
            alert(result.message);
        } else {
            alert('Erreur: ' + result.error);
        }
    } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur lors de l\'enregistrement');
    }
});

async function deleteFiche(id, tache) {
    if (!confirm(`Supprimer la tâche "${tache}" ?`)) return;

    try {
        const response = await fetch(`/api/fiches-poste/${id}/delete/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        });

        const result = await response.json();

        if (result.success) {
            loadFiches();
            alert(result.message);
        } else {
            alert('Erreur: ' + result.error);
        }
    } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur lors de la suppression');
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
