{% extends "base.html" %}
{% load static %}

{% block title %}Nouvelle évaluation{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-3xl">
    <h1 class="text-3xl font-bold mb-6">Nouvelle évaluation</h1>

    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <form id="formEvaluation" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Employé à évaluer *</span></label>
                    <select id="employe_id" class="select select-bordered" required>
                        <option value="">-- Choisir un employé --</option>
                        {% for emp in employes %}
                            <option value="{{ emp.id }}" data-superieur="{{ emp.superieur_hierarchique.id|default:'' }}">
                                {{ emp.surnom|default:emp.nom_complet }} - {{ emp.poste.nom_poste|default:"-" }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Évaluateur *</span></label>
                    <select id="evaluateur_id" class="select select-bordered" required>
                        <option value="">-- Choisir un évaluateur --</option>
                        {% for emp in employes %}
                            <option value="{{ emp.id }}" {% if current_evaluateur_id and emp.id|stringformat:"s" == current_evaluateur_id %}selected{% endif %}>{{ emp.surnom|default:emp.nom_complet }}</option>
                        {% endfor %}
                    </select>
                    <label class="label">
                        <span class="label-text-alt text-base-content/60">Par défaut, le supérieur hiérarchique actuel est sélectionné.</span>
                    </label>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Date évaluation *</span></label>
                        <input type="date" id="date_evaluation" class="input input-bordered" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Période début *</span></label>
                        <input type="date" id="periode_debut" class="input input-bordered" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Période fin *</span></label>
                        <input type="date" id="periode_fin" class="input input-bordered" required>
                    </div>
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Commentaire général</span></label>
                    <textarea id="commentaire_general" class="textarea textarea-bordered h-24"></textarea>
                </div>

                <div class="card-actions justify-end">
                    <a href="{% url 'employees:evaluations_list' %}" class="btn">Annuler</a>
                    <button type="submit" class="btn btn-primary">Créer l'évaluation</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Définir la date d'aujourd'hui par défaut
document.getElementById('date_evaluation').valueAsDate = new Date();

// Mise à jour automatique de l'évaluateur selon le supérieur hiérarchique
document.getElementById('employe_id').addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    const superieurId = selectedOption.getAttribute('data-superieur');
    if (superieurId) {
        document.getElementById('evaluateur_id').value = superieurId;
    }
});

document.getElementById('formEvaluation').addEventListener('submit', async function(e) {
    e.preventDefault();

    const data = {
        employe_id: document.getElementById('employe_id').value,
        evaluateur_id: document.getElementById('evaluateur_id').value,
        date_evaluation: document.getElementById('date_evaluation').value,
        periode_debut: document.getElementById('periode_debut').value,
        periode_fin: document.getElementById('periode_fin').value,
        commentaire_general: document.getElementById('commentaire_general').value
    };

    try {
        const response = await fetch('/employes/api/evaluations/create/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            alert(result.message);
            window.location.href = `/employes/evaluations/${result.evaluation_id}/`;
        } else {
            alert('Erreur: ' + result.error);
        }
    } catch (error) {
        console.error('Erreur:', error);
        alert('Erreur lors de la création. Détails: ' + error.message);
    }
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
