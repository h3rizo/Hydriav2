{# Legende compacte et persistante Type/Niveau, partagee entre vue matricielle et vue graphique. #}
<details class="mt-2 group" open>
    <summary class="text-xs font-semibold text-base-content/60 cursor-pointer select-none inline-flex items-center gap-1">
        <i class="fas fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i>
        Legende classification
    </summary>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 mt-2 text-xs">
        <div class="flex flex-wrap items-center gap-2">
            <span class="text-base-content/50">Type :</span>
            <template x-for="code in PC.TYPE_ORDER" :key="code">
                <span class="inline-flex items-center gap-1">
                    <span class="inline-block w-2.5 h-2.5 rounded-full" :class="PC.getType(code).dotClass"></span>
                    <span x-text="PC.typeLabel(code)"></span>
                </span>
            </template>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-base-content/50">Niveau :</span>
            <span class="inline-flex items-center gap-1"><span class="text-base-content/70">◌</span> Execution (leger)</span>
            <span class="inline-flex items-center gap-1"><span class="text-base-content/70">●</span> Management (marque)</span>
        </div>
    </div>
</details>
