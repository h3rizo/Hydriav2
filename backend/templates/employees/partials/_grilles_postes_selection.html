{# Cases a cocher des postes affiches, partagees entre la vue graphique et la vue matricielle (grilles salariales). #}
<div class="rounded-lg border border-base-300 bg-base-200/40 p-3">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div>
            <p class="font-semibold text-sm">Postes affiches</p>
            <p class="text-xs text-base-content/60">
                Decochez les postes a masquer : le choix vaut pour le graphique et la matrice, et reste memorise sur ce navigateur.
            </p>
        </div>
        <div class="flex items-center gap-2">
            <span class="badge badge-ghost badge-sm" x-text="`${selectedChartPostes.length}/${carto.postes.length}`"></span>
            <button type="button" class="btn btn-ghost btn-xs" @click="selectAllChartPostes()">Tout afficher</button>
            <button type="button" class="btn btn-ghost btn-xs" @click="clearChartPostes()">Tout masquer</button>
        </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-48 overflow-y-auto pr-1">
        <template x-for="poste in carto.postes" :key="poste.poste_id">
            <label class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-base-100 cursor-pointer text-sm">
                <input type="checkbox" class="checkbox checkbox-xs"
                       :value="poste.poste_id" x-model="selectedChartPostes" @change="onSelectionPostesChange()">
                <span class="inline-block w-3 h-3 rounded-full shrink-0"
                      :style="`background-color: ${PC.chartColor(poste.type_poste)}`"></span>
                <span class="truncate" x-text="poste.poste_nom" :title="poste.poste_nom"></span>
                <span class="badge badge-xs ml-auto" :class="PC.typeBadgeClass(poste.type_poste)"
                      x-text="PC.getType(poste.type_poste) ? PC.getType(poste.type_poste).shortLabel : '?'"></span>
            </label>
        </template>
    </div>
</div>
