{# Filtres Type de poste / Niveau, partages entre vue matricielle et vue graphique. #}
<div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-base-200">
    <span class="text-xs font-semibold text-base-content/60 mr-1">Filtrer :</span>
    <select class="select select-bordered select-xs" x-model="chartFilterType" @change="renderChart()">
        <option value="">Tous les types</option>
        <template x-for="code in PC.TYPE_ORDER" :key="code">
            <option :value="code" x-text="PC.typeLabel(code)"></option>
        </template>
    </select>
    <select class="select select-bordered select-xs" x-model="chartFilterNiveau" @change="renderChart()">
        <option value="">Tous les niveaux</option>
        <template x-for="code in PC.NIVEAU_ORDER" :key="code">
            <option :value="code" x-text="PC.niveauLabel(code)"></option>
        </template>
    </select>
    <button type="button" class="btn btn-ghost btn-xs" x-show="chartFilterType || chartFilterNiveau"
            @click="chartFilterType = ''; chartFilterNiveau = ''; renderChart()">
        <i class="fas fa-times mr-1"></i>Reinitialiser
    </button>
</div>
