{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold">{{ title }}</h1>
            <p class="text-base-content/70">Article {{ article.numero_article }} - {{ article.organisation.nom_organisation }}</p>
        </div>
        <a href="{% url 'employees:contrat_article_modele_list' %}" class="btn btn-ghost">Retour</a>
    </div>

    <form method="post" class="card bg-base-100 shadow">
        {% csrf_token %}
        <div class="card-body space-y-4">
            <div>
                <label class="label"><span class="label-text">Numero d'article</span></label>
                {{ form.numero_article }}
            </div>
            <div>
                <label class="label"><span class="label-text">Contenu</span></label>
                {{ form.contenu_article }}
            </div>
            <div class="flex items-center gap-3">
                {{ form.actif }}
                <span>Article actif</span>
            </div>
            <div class="card-actions justify-end">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
