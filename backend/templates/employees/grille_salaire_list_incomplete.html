{% extends "base.html" %}
{% load static %}
{% load humanize %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold">
                <i class="fas fa-money-check-alt text-success mr-2"></i>
                Grilles de Salaire
            </h1>
            <p class="text-sm text-base-content/70 mt-1">Gestion des salaires et calculs IRSA</p>
        </div>
        <button onclick="openCreateModal()" class="btn btn-success gap-2">
            <i class="fas fa-plus"></i>
            Nouvelle Grille
        </button>
    </div>

    <!-- Filtres -->
    <div class="card bg-base-100 shadow mb-6">
        <div class="card-body">
            <h2 class="card-title text-lg mb-4">
                <i class="fas fa-filter text-info mr-2"></i>
                Filtres
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Filtre Employé -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Employé</span>
                    </label>
                    <select id="filter-employe" class="select select-bordered">
                        <option value="">Tous les employés</option>
                        {% for emp in employes %}
                        <option value="{{ emp.id }}">{{ emp.surnom }} - {{ emp.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Filtre Année -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Année</span>
                    </label>
                    <select id="filter-annee" class="select select-bordered">
                        <option value="">Toutes</option>
                        {% for year in annees %}
                        <option value="{{ year }}" {% if year == current_year %}selected{% endif %}>{{ year }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Filtre Mois -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Mois</span>
                    </label>
                    <select id="filter-mois" class="select select-bordered">
                        <option value="">Tous</option>
                        <option value="1">Janvier</option>
                        <option value="2">Février</option>
                        <option value="3">Mars</option>
                        <option value="4">Avril</option>
                        <option value="5">Mai</option>
                        <option value="6">Juin</option>
                        <option value="7">Juillet</option>
                        <option value="8">Août</option>
                        <option value="9">Septembre</option>
                        <option value="10">Octobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Décembre</option>
                    </select>
                </div>

                <!-- Boutons action -->
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">&nbsp;</span>
                    </label>
                    <div class="flex gap-2">
                        <button onclick="loadGrilles()" class="btn btn-primary flex-1">
                            <i class="fas fa-search"></i>
                            Filtrer
                        </button>
                        <button onclick="resetFilters()" class="btn btn-ghost">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau des grilles -->
    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table table-zebra">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Employé</th>
                            <th>Poste</th>
                            <th class="text-right">Salaire Brut Base</th>
                            <th class="text-right">Salaire Brut Total</th>
                            <th class="text-right">Salaire Net</th>
                            <th class="text-right">IRSA</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="grilles-tbody">
                        <tr>
                            <td colspan="8" class="text-center py-8">
                                <span class="loading loading-spinner loading-lg text-primary"></span>
                                <p class="text-sm text-base-content/70 mt-2">Chargement des grilles...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
