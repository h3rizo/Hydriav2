{% extends "base.html" %}

{% block title %}Vérification du code - Hydria{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 text-center">
                <span class="text-4xl">📧</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Vérifiez votre email
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Nous avons envoyé un code à 6 chiffres à <strong>{{ email }}</strong>.
            </p>
        </div>
        
        <div class="bg-white py-8 px-6 shadow-lg rounded-lg">
            <form class="space-y-6" method="post">
                {% csrf_token %}
                
                <div class="space-y-4">
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700">
                            Code de vérification
                        </label>
                        <div class="mt-1">
                            <input type="text" name="code" id="code" 
                                   class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm text-center tracking-widest font-bold" 
                                   placeholder="000000" maxlength="6"
                                   required autofocus>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Nouveau mot de passe
                        </label>
                        <div class="mt-1">
                            <input type="password" name="password" id="password" 
                                   class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                                   placeholder="Au moins 8 caractères" 
                                   required>
                        </div>
                    </div>

                    <div>
                        <label for="confirm_password" class="block text-sm font-medium text-gray-700">
                            Confirmez le mot de passe
                        </label>
                        <div class="mt-1">
                            <input type="password" name="confirm_password" id="confirm_password" 
                                   class="appearance-none block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
                                   placeholder="Confirmez votre mot de passe" 
                                   required>
                        </div>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Réinitialiser le mot de passe
                    </button>
                </div>
                
                <div class="text-center">
                    <p class="text-xs text-gray-500">
                        Vous n'avez pas reçu l'email ? Regardez dans vos spams ou 
                        <a href="{% url 'system:password_reset_request' %}" class="text-blue-600 hover:text-blue-500">réessayez</a>.
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
