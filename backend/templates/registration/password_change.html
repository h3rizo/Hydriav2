{% extends "base.html" %}

{% block title %}Changer de mot de passe - Hydria{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10">
    <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body">
            <h2 class="card-title text-2xl font-bold mb-4">
                <i class="fas fa-key text-primary mr-2"></i>Changer votre mot de passe
            </h2>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text font-semibold">{{ field.label }}</span>
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <label class="label">
                                <span class="label-text-alt text-base-content/60">{{ field.help_text|safe }}</span>
                            </label>
                        {% endif %}
                        {% if field.errors %}
                            <label class="label">
                                <span class="label-text-alt text-error">
                                    {% for error in field.errors %}{{ error }}{% endfor %}
                                </span>
                            </label>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="card-actions justify-end mt-6">
                    <button type="submit" class="btn btn-primary w-full sm:w-auto">
                        Mettre à jour le mot de passe
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Ajouter des classes DaisyUI aux inputs du formulaire Django
    document.querySelectorAll('input').forEach(input => {
        if (input.type !== 'submit' && input.type !== 'hidden') {
            input.classList.add('input', 'input-bordered', 'w-full');
        }
    });
</script>
{% endblock %}
