<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ session_obj.titre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-12">
        <section class="w-full rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl backdrop-blur">
            <p class="text-sm uppercase tracking-[0.3em] text-amber-300">Rendez-vous reseau</p>
            <h1 class="mt-3 text-4xl font-semibold">{{ session_obj.titre }}</h1>
            {% if session_obj.description %}<p class="mt-4 text-stone-300">{{ session_obj.description }}</p>{% endif %}
            <form method="post" action="{% url 'usagers:reseau_request_magic_link' session_obj.slug %}" class="mt-8 space-y-4">
                {% csrf_token %}
                <label class="block">
                    <span class="mb-2 block text-sm text-stone-300">Prénom</span>
                    <input type="text" name="nom" required placeholder="Jean" class="w-full rounded-2xl border border-white/10 bg-stone-900 px-4 py-3 outline-none ring-0 text-white placeholder-stone-600">
                </label>
                <label class="block">
                    <span class="mb-2 block text-sm text-stone-300">Adresse email</span>
                    <input type="email" name="email" required placeholder="jean@exemple.com" class="w-full rounded-2xl border border-white/10 bg-stone-900 px-4 py-3 outline-none ring-0 text-white placeholder-stone-600">
                </label>
                <button type="submit" class="rounded-2xl bg-amber-400 px-5 py-3 font-medium text-stone-950">Recevoir mon lien d'acces</button>
            </form>
            {% if messages %}
                <div class="mt-6 space-y-2">
                    {% for message in messages %}
                        <div class="rounded-2xl bg-emerald-500/15 px-4 py-3 text-sm text-emerald-200">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
