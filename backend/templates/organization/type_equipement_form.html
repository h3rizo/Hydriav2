{% extends 'base.html' %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">{{ title }}</h1>
        <a href="{% url 'organization:type_equipement_list' %}" class="btn btn-outline">
            <i class="fas fa-arrow-left mr-2"></i>Retour à la liste
        </a>
    </div>

    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Nom du type d'équipement</span>
                        <span class="text-error">*</span>
                    </label>
                    <input type="text" name="nom_type" class="input input-bordered"
                           value="{% if type_equipement %}{{ type_equipement.nom_type }}{% endif %}"
                           required maxlength="255" placeholder="Ex: Captage, Citerne, Brise-charge...">
                    <label class="label">
                        <span class="label-text-alt">
                            Ex: Captage, Citerne, Brise-charge, etc.
                        </span>
                    </label>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Description</span>
                    </label>
                    <textarea name="description" class="textarea textarea-bordered h-24"
                              placeholder="Description optionnelle du type d'équipement...">{% if type_equipement %}{{ type_equipement.description }}{% endif %}</textarea>
                    <label class="label">
                        <span class="label-text-alt">Description détaillée (optionnelle)</span>
                    </label>
                </div>

                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text">Type d'équipement actif</span>
                        <input type="checkbox" name="is_active" class="checkbox checkbox-primary"
                               {% if not type_equipement or type_equipement.is_active %}checked{% endif %}>
                    </label>
                    <label class="label">
                        <span class="label-text-alt">
                            Les types inactifs ne seront pas disponibles pour les nouveaux équipements
                        </span>
                    </label>
                </div>

                <div class="card-actions justify-end">
                    <a href="{% url 'organization:type_equipement_list' %}" class="btn btn-outline">Annuler</a>
                    <button type="submit" class="btn btn-primary">
                        {% if type_equipement %}
                            Modifier le type
                        {% else %}
                            Créer le type
                        {% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
