<div class="mt-3 min-w-72 rounded-lg border border-base-300 bg-base-100 p-3"
     data-dossier-checklist="{{ item.ouvrage.pk }}">
    <div class="flex items-center justify-between gap-2">
        <span class="text-xs font-semibold">Contenu du dossier</span>
        <span class="badge badge-sm {% if item.dossier_documents_complete %}badge-success{% elif item.dossier_documents_completed %}badge-warning{% else %}badge-ghost{% endif %}"
              data-checklist-badge="{{ item.ouvrage.pk }}">
            <span data-checklist-count="{{ item.ouvrage.pk }}">{{ item.dossier_documents_completed }}</span>/{{ item.dossier_documents_total }}
        </span>
    </div>
    <progress class="progress {% if item.dossier_documents_complete %}progress-success{% else %}progress-warning{% endif %} mt-2 w-full"
              data-checklist-progress="{{ item.ouvrage.pk }}"
              value="{{ item.dossier_documents_percentage }}" max="100"></progress>
    <p class="mt-1 text-[11px] opacity-60">Un seul fichier peut couvrir plusieurs documents.</p>
    <div class="mt-2 grid gap-1.5">
        {% for document in item.dossier_checklist %}
        <label class="flex cursor-pointer items-start gap-2 rounded px-1 py-0.5 text-xs hover:bg-base-200">
            <input type="checkbox"
                   class="checkbox checkbox-success checkbox-xs mt-0.5 dossier-document-checkbox"
                   data-ouvrage-id="{{ item.ouvrage.pk }}"
                   data-document="{{ document.key }}"
                   data-url="{% url 'organization:api_ouvrage_dossier_technique_checklist' item.ouvrage.pk %}"
                   {% if document.checked %}checked{% endif %}>
            <span>{{ document.label }}</span>
        </label>
        {% endfor %}
    </div>
</div>
