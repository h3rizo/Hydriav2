{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold">Supprimer grading annuel</h1>

    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <div class="alert alert-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Cette action est irreversible.</span>
            </div>

            <p>
                Voulez-vous supprimer le grading
                <strong>{{ grading.grade }}</strong>
                pour l'ouvrage <strong>{{ grading.ouvrage.nom_ouvrage }}</strong>
                (annee <strong>{{ grading.annee }}</strong>) ?
            </p>

            <form method="post" class="card-actions justify-end">
                {% csrf_token %}
                <a href="{% url 'organization:ouvrage_grading_annuel_list' %}" class="btn btn-ghost">Annuler</a>
                <button type="submit" class="btn btn-error">
                    <i class="fas fa-trash mr-2"></i>Supprimer
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
