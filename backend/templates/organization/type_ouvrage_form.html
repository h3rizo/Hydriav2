{% extends 'base.html' %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">{{ title }}</h1>
        <a href="{% url 'organization:type_ouvrage_list' %}" class="btn btn-outline">
            <i class="fas fa-arrow-left mr-2"></i>Retour à la liste
        </a>
    </div>

    <div class="card bg-base-100 shadow-xl max-w-2xl mx-auto">
        <div class="card-body">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">{{ form.nom_type_ouvrage.label }}</span>
                        {% if form.nom_type_ouvrage.field.required %}
                            <span class="text-error">*</span>
                        {% endif %}
                    </label>
                    {{ form.nom_type_ouvrage }}
                    {% if form.nom_type_ouvrage.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ form.nom_type_ouvrage.errors.0 }}</span>
                        </label>
                    {% endif %}
                    <label class="label">
                        <span class="label-text-alt">
                            Ex: Forage, Puits traditionnel, Système d'adduction d'eau, etc.
                        </span>
                    </label>
                </div>

                <div class="form-control">
                    <label class="label cursor-pointer justify-start gap-4">
                        {{ form.existe }}
                        <span class="label-text">
                            {{ form.existe.label }}
                            <span class="text-sm text-base-content/70 block">
                                (Décocher si ce type d'ouvrage n'existe pas physiquement)
                            </span>
                        </span>
                    </label>
                    {% if form.existe.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ form.existe.errors.0 }}</span>
                        </label>
                    {% endif %}
                </div>

                <div class="card-actions justify-end">
                    <a href="{% url 'organization:type_ouvrage_list' %}" class="btn btn-outline">Annuler</a>
                    <button type="submit" class="btn btn-primary">
                        {% if type_ouvrage %}
                            Modifier le type
                        {% else %}
                            Créer le type
                        {% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
