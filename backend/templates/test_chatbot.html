<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-100">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold mb-4">Test du bouton chatbot</h1>
        <p class="mb-4">Le bouton devrait apparaître en bas à droite de la page.</p>
    </div>

    <!-- Bouton flottant -->
    <div id="floating-chat-btn" class="fixed bottom-6 right-6 z-50">
        <button class="btn btn-circle btn-primary btn-lg shadow-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
        </button>
    </div>

    <script>
        console.log('Bouton chatbot chargé');
        const btn = document.getElementById('floating-chat-btn');
        console.log('Bouton trouvé:', btn);
        console.log('Styles computed:', window.getComputedStyle(btn));
    </script>
</body>
</html>
