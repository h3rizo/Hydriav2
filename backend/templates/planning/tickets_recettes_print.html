{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Factures A4 - Recettes</title>
</head>
<body>
    <div id="loading" style="text-align: center; padding: 50px;">
        <h2>Preparation des factures A4 en cours...</h2>
        <p>Mise en page de plusieurs factures par feuille.</p>
    </div>

    <script src="{% static 'js/print_recettes_avances_a4.js' %}?v=2026081502"></script>
    <script>
        const recettes = {{ details_recettes|safe }};
        const organisation = {{ organisation_json|safe }};

        window.onload = function() {
            const tickets = recettes.map((recette) => ({
                type: 'Recette',
                isBonPaiement: false,
                source_type: 'planning_detail',
                numero_bon: recette.numero_bon_avance || `REC-${recette.id}`,
                date: recette.date_planning,
                employe: recette.employe_surnom,
                ouvrage: recette.ouvrage_nom,
                point_eau: recette.point_eau_code || '',
                nom_abonne: recette.nom_abonne || '',
                organisation: organisation.nom_organisation,
                logo_url: organisation.logo_url,
                nif: organisation.nif,
                stat: organisation.stat,
                base: recette.base_nom || '',
                base_telephone: recette.base_telephone || '',
                telephone: organisation.telephone || '',
                compte: recette.compte_nom || '',
                lignes: [{
                    designation: recette.designation_nom,
                    quantity: recette.quantity || 1,
                    pu: recette.pu || recette.montant,
                    montant: recette.montant
                }],
                montant: recette.montant
            }));

            const html = window.buildRecettesAvancesA4Html(tickets, organisation, {
                autoPrint: true,
                showToolbar: true
            });

            document.open();
            document.write(html);
            document.close();
        };
    </script>
</body>
</html>
