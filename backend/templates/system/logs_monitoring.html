{% extends admin_shell_base_template %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">
            <i class="fas fa-file-alt mr-2 text-info"></i>Logs & Monitoring
        </h1>
        <button onclick="loadLogs()" class="btn btn-primary">
            <i class="fas fa-sync-alt mr-2"></i>Actualiser
        </button>
    </div>

    <!-- Statistiques -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="stat bg-base-200 rounded-lg shadow">
            <div class="stat-title">Total Logs</div>
            <div class="stat-value text-primary" id="stat-total">0</div>
        </div>
        <div class="stat bg-base-200 rounded-lg shadow">
            <div class="stat-title">Creations</div>
            <div class="stat-value text-success" id="stat-create">0</div>
        </div>
        <div class="stat bg-base-200 rounded-lg shadow">
            <div class="stat-title">Modifications</div>
            <div class="stat-value text-warning" id="stat-update">0</div>
        </div>
        <div class="stat bg-base-200 rounded-lg shadow">
            <div class="stat-title">Erreurs</div>
            <div class="stat-value text-error" id="stat-error">0</div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="card bg-base-200">
        <div class="card-body">
            <div class="flex gap-3">
                <select id="filterLogType" class="select select-bordered" onchange="loadLogs()">
                    <option value="">Tous les types</option>
                    <option value="create">Creation</option>
                    <option value="update">Modification</option>
                    <option value="delete">Suppression</option>
                    <option value="login">Connexion</option>
                    <option value="logout">Deconnexion</option>
                    <option value="export">Export</option>
                    <option value="import">Import</option>
                    <option value="error">Erreur</option>
                    <option value="warning">Avertissement</option>
                    <option value="info">Information</option>
                </select>
                <input type="text" id="searchInput" placeholder="Rechercher..." class="input input-bordered flex-1" onkeyup="handleSearch(event)">
                <button onclick="loadLogs()" class="btn btn-primary">
                    <i class="fas fa-search mr-2"></i>Rechercher
                </button>
            </div>
        </div>
    </div>

    <!-- Tableau logs -->
    <div class="card bg-base-200">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table table-zebra w-full table-sm">
                    <thead>
                        <tr>
                            <th>Date/Heure</th>
                            <th>Type</th>
                            <th>Utilisateur</th>
                            <th>Action</th>
                            <th>Modele</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="logsTable">
                        <tr><td colspan="6" class="text-center">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="flex justify-center mt-4" id="pagination"></div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;

function loadLogs(page = 1) {
    currentPage = page;
    const logType = document.getElementById('filterLogType').value;
    const search = document.getElementById('searchInput').value;

    let url = `/systeme/api/logs/?page=${page}`;
    if (logType) {
        url += `&log_type=${logType}`;
    }
    if (search) {
        url += `&search=${encodeURIComponent(search)}`;
    }

    fetch(url)
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('logsTable');
            tbody.innerHTML = '';

            if (data.logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Aucun log</td></tr>';
                return;
            }

            data.logs.forEach(log => {
                const badgeClass = {
                    'create': 'badge-success',
                    'update': 'badge-warning',
                    'delete': 'badge-error',
                    'error': 'badge-error',
                    'warning': 'badge-warning',
                    'info': 'badge-info'
                }[log.log_type] || 'badge-ghost';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="text-xs">${log.created_at}</td>
                    <td><span class="badge ${badgeClass} badge-sm">${log.log_type_display}</span></td>
                    <td class="font-semibold">${log.user}</td>
                    <td>${log.action}</td>
                    <td class="text-sm">${log.model_name}</td>
                    <td class="text-xs">${log.details}</td>
                `;
                tbody.appendChild(row);
            });
        });

    // Load stats
    fetch('/systeme/api/logs/stats/')
        .then(response => response.json())
        .then(data => {
            document.getElementById('stat-total').textContent = data.total_logs || 0;
            document.getElementById('stat-create').textContent = data.stats_by_type.create || 0;
            document.getElementById('stat-update').textContent = data.stats_by_type.update || 0;
            document.getElementById('stat-error').textContent = data.stats_by_type.error || 0;
        });
}

function handleSearch(event) {
    if (event.key === 'Enter') {
        loadLogs(1);
    }
}

loadLogs();
</script>
{% endblock %}
