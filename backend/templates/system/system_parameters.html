{% extends admin_shell_base_template %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">
            <i class="fas fa-sliders-h mr-2 text-warning"></i>Parametres Systeme
        </h1>
        <div class="flex gap-2">
            <a href="{% url 'system:storage_monitoring' %}" class="btn btn-secondary">
                <i class="fas fa-hard-drive mr-2"></i>Stockage VPS
            </a>
            <a href="{% url 'system:download_data_backup' %}" class="btn btn-outline">
                <i class="fas fa-file-code mr-2"></i>Backup JSON
            </a>
            <a href="{% url 'system:download_postgres_backup' %}" class="btn btn-primary">
                <i class="fas fa-database mr-2"></i>Backup PostgreSQL
            </a>
        </div>
    </div>

    <!-- Filtres par categorie -->
    <div class="card bg-base-200">
        <div class="card-body">
            <div class="tabs tabs-boxed">
                <a class="tab tab-active" onclick="filterCategory('')">Tous</a>
                <a class="tab" onclick="filterCategory('general')">General</a>
                <a class="tab" onclick="filterCategory('email')">Email</a>
                <a class="tab" onclick="filterCategory('security')">Securite</a>
                <a class="tab" onclick="filterCategory('billing')">Facturation</a>
            </div>
        </div>
    </div>

    <!-- Tableau parametres -->
    <div class="card bg-base-200">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table table-zebra w-full">
                    <thead>
                        <tr>
                            <th>Categorie</th>
                            <th>Cle</th>
                            <th>Valeur</th>
                            <th>Description</th>
                            <th>Modifie le</th>
                            <th>Par</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="parametersTable">
                        <tr><td colspan="7" class="text-center">Aucun parametre configure</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let currentCategory = '';

function loadParameters(category = '') {
    currentCategory = category;

    let url = `/systeme/api/parameters/`;
    if (category) {
        url += `?category=${category}`;
    }

    fetch(url)
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('parametersTable');
            tbody.innerHTML = '';

            if (data.parameters.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Aucun parametre</td></tr>';
                return;
            }

            data.parameters.forEach(param => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="badge">${param.category}</span></td>
                    <td class="font-mono">${param.key}</td>
                    <td class="font-semibold">${param.value}</td>
                    <td class="text-sm">${param.description}</td>
                    <td class="text-sm">${param.updated_at}</td>
                    <td class="text-sm">${param.updated_by}</td>
                    <td>
                        <button class="btn btn-xs btn-ghost" onclick="editParameter('${param.id}')">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        });
}

function filterCategory(category) {
    // Update active tab
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('tab-active');
    });
    event.target.classList.add('tab-active');

    loadParameters(category);
}

function editParameter(paramId) {
    alert('Edition parametre ' + paramId + ' - A implementer');
}

loadParameters();
</script>
{% endblock %}
