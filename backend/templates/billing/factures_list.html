{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">{{ title }}</h1>
        <a href="#" class="btn btn-accent">
            <i class="fas fa-plus mr-2"></i>Nouvelle Facture
        </a>
    </div>

    <div class="card bg-base-200 shadow-md">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table table-zebra w-full">
                    <thead>
                        <tr>
                            <th>N° Facture</th>
                            <th>Client</th>
                            <th>Date</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="hover cursor-pointer">
                            <td>FAC-2025-001</td>
                            <td>Jean Dupont</td>
                            <td>10/09/2025</td>
                            <td>125.000 Ar</td>
                            <td><span class="badge badge-warning">En attente</span></td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-ghost btn-xs" title="Voir détails">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs text-success" title="Payer">
                                        <i class="fas fa-credit-card"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs text-error" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr class="hover cursor-pointer">
                            <td>FAC-2025-002</td>
                            <td>Marie Rakoto</td>
                            <td>11/09/2025</td>
                            <td>89.500 Ar</td>
                            <td><span class="badge badge-success">Payée</span></td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-ghost btn-xs" title="Voir détails">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Imprimer">
                                        <i class="fas fa-print"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs text-error" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
