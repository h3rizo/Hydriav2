{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-base-content">{{ title }}</h1>
        <a href="#" class="btn btn-accent">
            <i class="fas fa-plus mr-2"></i>Nouveau Compteur
        </a>
    </div>

    <div class="card bg-base-200 shadow-md">
        <div class="card-body">
            <div class="overflow-x-auto">
                <table class="table table-zebra w-full">
                    <thead>
                        <tr>
                            <th>N° Compteur</th>
                            <th>Client</th>
                            <th>Type</th>
                            <th>Installation</th>
                            <th>Dernier Relevé</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="hover cursor-pointer">
                            <td>COMP-001</td>
                            <td>Jean Dupont</td>
                            <td>Résidentiel</td>
                            <td>15/03/2024</td>
                            <td>245 m³</td>
                            <td><span class="badge badge-success">Actif</span></td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-ghost btn-xs" title="Voir détails">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Nouveau relevé">
                                        <i class="fas fa-tachometer-alt"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs text-error" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr class="hover cursor-pointer">
                            <td>COMP-002</td>
                            <td>Marie Rakoto</td>
                            <td>Commercial</td>
                            <td>22/04/2024</td>
                            <td>312 m³</td>
                            <td><span class="badge badge-warning">Maintenance</span></td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-ghost btn-xs" title="Voir détails">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs" title="Nouveau relevé">
                                        <i class="fas fa-tachometer-alt"></i>
                                    </button>
                                    <button class="btn btn-ghost btn-xs text-error" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
