{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="hydriaLight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hydria{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/icons/icons8-vase-94.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.10/dist/full.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/hydria-themes.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100 text-base-content">
    {% block content %}{% endblock %}
</body>
</html>
