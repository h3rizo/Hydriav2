{% extends 'base.html' %}

{% block title %}{{ titre }} - Hydria{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-4">
  <div>
    <p class="text-xs uppercase tracking-wide opacity-60">Liste complète du widget</p>
    <h1 class="text-2xl font-bold">{{ titre }}</h1>
    <p class="text-sm opacity-70" id="listeTotal">Chargement…</p>
  </div>
  <div class="card bg-base-100 shadow"><div class="card-body p-3" id="listeBody"></div></div>
</div>

<script>
(async function () {
  const body = document.getElementById('listeBody');
  const total = document.getElementById('listeTotal');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  try {
    const r = await fetch("{{ api_url|escapejs }}", { credentials: 'same-origin' });
    const data = await r.json();
    if (!data.success || !data.rows.length) { total.textContent = 'Aucun élément'; return; }
    total.textContent = data.total.toLocaleString('fr-FR') + ' élément' + (data.total > 1 ? 's' : '');
    let last = null;
    body.innerHTML = data.rows.map(row => {
      let head = '';
      if (row.group && row.group !== last) {
        last = row.group;
        head = `<div class="text-xs font-bold uppercase opacity-70 mt-3 mb-1 border-b border-base-300">${esc(row.group)}</div>`;
      }
      const idxls = row.idxls ? `<span class="badge badge-outline badge-sm mr-2">${esc(row.idxls)}</span>` : '';
      const inner = `<div class="font-semibold">${idxls}${esc(row.label)}</div>${row.sub ? `<div class="text-xs opacity-70">${esc(row.sub)}</div>` : ''}`;
      return head + (row.href
        ? `<a class="block py-2 px-1 border-b border-base-200 hover:bg-base-200 rounded" href="${esc(row.href)}">${inner}</a>`
        : `<div class="py-2 px-1 border-b border-base-200">${inner}</div>`);
    }).join('');
  } catch (e) {
    total.textContent = 'Erreur de chargement';
  }
})();
</script>
{% endblock %}
