# Configuration pour l'import DiameX Local
# Ce fichier peut être modifié avec le Bloc-notes

[SERVEUR]
# URL du serveur Django (production)
DJANGO_URL = https://www.hydria.mg

# URL dédiée aux endpoints d'upload des scans
SCAN_API_URL = https://compta.hydria.mg

# Jeton de l'agent d'import (même valeur que DIAMEX_AGENT_TOKEN dans le .env du serveur)
AGENT_TOKEN =

# Pour tests en local, décommentez la ligne ci-dessous et commentez celle du dessus
# DJANGO_URL = http://localhost:8000

[OPTIONS]
# Timeout pour les requêtes (en secondes)
TIMEOUT = 300
IMPORT_BATCH_SIZE = 1000

# Afficher les détails lors de l'import (True/False)
VERBOSE = True

[AGENT]
# Local agent configuration (Windows)
HOST = 127.0.0.1
PORT = 8765
ALLOWED_ORIGINS = https://www.hydria.mg, https://hydria.mg, https://compta.hydria.mg, https://paie.hydria.mg, https://admin.hydria.mg, https://analyses.hydria.mg, https://ouvrages.hydria.mg, https://planning.hydria.mg, https://logistique.hydria.mg, http://localhost:8000
SCAN_BATCH_SIZE = 5
SCAN_BATCH_RETRIES = 2
