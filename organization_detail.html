 <tr id="org-{{ org.id }}">
     <td>{{ org.name }}</td>
     <td>{{ org.address }}</td>
     <td>
         {% if org.is_active %}
             <div class="badge badge-success">Oui</div>
         {% else %}
             <div class="badge badge-error">Non</div>
         {% endif %}
     </td>
     <td>
         <button 
             hx-get="{% url 'organizations:edit' org.id %}" 
             hx-target="#org-{{ org.id }}" 
             hx-swap="outerHTML"
             class="btn btn-sm btn-outline btn-primary">
             Modifier
         </button>
     </td>
 </tr>
