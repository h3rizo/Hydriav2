<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydria · Activités du jour</title>
  <style>
    :root { color-scheme:dark; --ink:#f4f9fa; --muted:#9bb2b8; --accent:#78d6c6; --line:rgba(218,238,242,.14); --panel:rgba(255,255,255,.06); --danger:#ffc1b2; --termine:#6fcf97; --encours:#f2a65a; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; color:var(--ink); font-family:"Segoe UI Variable","Segoe UI",sans-serif; background:radial-gradient(circle at 12% 0%,rgba(77,160,150,.26),transparent 35%),linear-gradient(155deg,#12313a,#07171f 72%); }
    button,input,select { font:inherit; }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .shell { height:100%; display:flex; flex-direction:column; }
    header { position:relative; padding:18px 18px 15px; border-bottom:1px solid var(--line); -webkit-app-region:drag; }
    .eyebrow { color:var(--accent); font-size:9px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:5px 140px 0 0; font-size:23px; line-height:1.08; letter-spacing:-.04em; }
    .subtitle { margin-top:7px; color:var(--muted); font-size:11px; }
    .controls { position:absolute; top:12px; right:12px; display:flex; gap:5px; -webkit-app-region:no-drag; }
    .icon { width:29px; height:29px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--panel); cursor:pointer; }
    .icon:hover { background:rgba(255,255,255,.13); transform:translateY(-1px); }
    .icon.active { color:var(--accent); border-color:rgba(120,214,198,.5); }
    main { min-height:0; flex:1; overflow-y:auto; padding:15px 17px 24px; scrollbar-width:thin; }
    .filtres-panel { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
    .filtres-panel.open { display:grid; }
    .filtres-panel .field { display:flex; flex-direction:column; gap:3px; }
    .filtres-panel .field.full { grid-column:1 / -1; }
    .filtres-panel label { font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .filtres-panel select { width:100%; padding:6px 7px; border:1px solid var(--line); border-radius:7px; color:var(--ink); background:rgba(255,255,255,.08); }
    .filtres-panel select[multiple] { min-height:64px; }
    .filtres-panel select option { color:#1b1b1b; }
    .counter-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .counter-label { color:var(--muted); font-size:10px; letter-spacing:.05em; text-transform:uppercase; }
    .counter { min-width:42px; height:42px; display:grid; place-items:center; border-radius:50%; color:#08211d; background:var(--accent); font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; padding:0 8px; }
    .card { margin-bottom:9px; padding:13px 14px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.055); }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .card-title { margin:0; font-size:14px; font-weight:750; line-height:1.3; }
    .badge { flex:none; padding:3px 8px; border-radius:999px; color:#08211d; font-size:9px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; }
    .badge.termine { background:var(--termine); }
    .badge.encours { background:var(--encours); }
    .card-meta { margin-top:6px; color:var(--muted); font-size:11px; line-height:1.55; }
    .card-note { margin-top:8px; padding:8px 10px; border-left:2px solid var(--accent); border-radius:0 8px 8px 0; background:rgba(0,0,0,.16); color:#d8e5e8; font-size:10.5px; line-height:1.5; }
    .state { padding:65px 22px; color:var(--muted); text-align:center; font-size:12px; line-height:1.6; }
    .state strong { display:block; margin-bottom:7px; color:var(--ink); font-size:17px; }
    .login { display:grid; gap:10px; margin-top:6px; }
    .login p { margin:0 0 5px; color:var(--muted); font-size:11px; line-height:1.5; }
    input { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:rgba(255,255,255,.08); }
    .error { min-height:16px; color:var(--danger); font-size:10px; }
    .primary,.secondary { min-height:43px; border-radius:10px; cursor:pointer; font-weight:750; }
    .primary { border:0; color:#08211d; background:var(--accent); width:100%; }
    .primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .secondary { padding:0 14px; border:1px solid var(--line); color:var(--ink); background:var(--panel); width:100%; margin-top:14px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; color:var(--muted); font-size:9px; }
    .link { border:0; padding:0; color:var(--accent); background:transparent; cursor:pointer; font-weight:700; }
    .skeleton { height:430px; border-radius:16px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.12),rgba(255,255,255,.04)); background-size:200% 100%; animation:shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">Hydria · planning</div>
    <h1>Activités du jour</h1>
    <div class="subtitle">Recouvrements forfaitaires, réparations… · aujourd’hui</div>
    <div class="controls">
      <button class="icon" id="filtresToggle" title="Filtres">▤</button>
      <button class="icon active" id="pin" title="Toujours au premier plan">◆</button>
      <button class="icon" id="startup" title="Lancer au démarrage de Windows">◉</button>
      <button class="icon" id="refresh" title="Actualiser">↻</button>
      <button class="icon" id="close" title="Fermer">×</button>
    </div>
  </header>
  <main>
    <div class="filtres-panel" id="filtresPanel">
      <div class="field">
        <label for="filtreEmploye">Personne</label>
        <select id="filtreEmploye"><option value="all">Moi-même et subordonnés</option></select>
      </div>
      <div class="field">
        <label for="filtreBase">Base</label>
        <select id="filtreBase"><option value="all">Toutes</option></select>
      </div>
      <div class="field">
        <label for="filtreRegion">Région</label>
        <select id="filtreRegion"><option value="all">Toutes</option></select>
      </div>
      <div class="field">
        <label for="filtreDistrict">District</label>
        <select id="filtreDistrict"><option value="all">Tous</option></select>
      </div>
      <div class="field full">
        <label for="filtreCommune">Commune</label>
        <select id="filtreCommune"><option value="all">Toutes</option></select>
      </div>
      <div class="field full">
        <label for="filtreType">Type d'activité (plusieurs choix possibles)</label>
        <select id="filtreType" multiple></select>
      </div>
    </div>
    <div id="content"><div class="state">Connexion à Hydria…</div></div>
  </main>
</div>
<script>
(() => {
  const BASE='https://www.hydria.mg';
  const ACTIVITES='/widget/api/planning/activites/';
  const FILTRES='/widget/api/planning/filtres/';
  const content=document.getElementById('content');
  let token=null;
  let filtresData=null;
  let selectedFiltres={employe:'all',base:'all',region:'all',district:'all',commune:'all',types:[]};
  const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const auth=()=>({Authorization:`Token ${token}`});
  document.getElementById('close').onclick=()=>window.widgetAPI.close();
  document.getElementById('refresh').onclick=()=>loadActivites();
  document.getElementById('pin').onclick=()=>window.widgetAPI.togglePin();
  document.getElementById('startup').onclick=async()=>document.getElementById('startup').classList.toggle('active',await window.widgetAPI.toggleStartup());
  window.widgetAPI.onPinState(value=>document.getElementById('pin').classList.toggle('active',value));
  window.widgetAPI.onForceRefresh(()=>loadActivites());

  const filtresToggle=document.getElementById('filtresToggle');
  const filtresPanel=document.getElementById('filtresPanel');
  filtresToggle.onclick=()=>{
    filtresPanel.classList.toggle('open');
    filtresToggle.classList.toggle('active', filtresPanel.classList.contains('open'));
  };

  function todayIso(){return new Date().toISOString().slice(0,10);}

  function currentFiltreParams(){
    const params=new URLSearchParams();
    if(selectedFiltres.employe && selectedFiltres.employe!=='all')params.set('employe_id',selectedFiltres.employe);
    if(selectedFiltres.base && selectedFiltres.base!=='all')params.set('base_id',selectedFiltres.base);
    if(selectedFiltres.commune && selectedFiltres.commune!=='all')params.set('commune_id',selectedFiltres.commune);
    else if(selectedFiltres.district && selectedFiltres.district!=='all')params.set('district_id',selectedFiltres.district);
    else if(selectedFiltres.region && selectedFiltres.region!=='all')params.set('region_id',selectedFiltres.region);
    (selectedFiltres.types||[]).forEach(id=>params.append('type_activite_id',id));
    return params;
  }

  function persistFiltres(){ window.widgetAPI.savePlanningFiltres(selectedFiltres); }

  function fillSelect(select, allLabel, options, selectedId){
    select.innerHTML=`<option value="all">${escapeHtml(allLabel)}</option>`+options.map(o=>`<option value="${o.id}">${escapeHtml(o.nom)}</option>`).join('');
    select.value=options.some(o=>o.id===selectedId)?selectedId:'all';
  }

  function refreshDistrictOptions(preselect){
    if(!filtresData)return;
    const regionId=document.getElementById('filtreRegion').value;
    const list=regionId==='all'?filtresData.districts:filtresData.districts.filter(d=>d.region_id===regionId);
    fillSelect(document.getElementById('filtreDistrict'),'Tous',list,preselect||'all');
  }
  function refreshCommuneOptions(preselect){
    if(!filtresData)return;
    const districtId=document.getElementById('filtreDistrict').value;
    const list=districtId==='all'?filtresData.communes:filtresData.communes.filter(c=>c.district_id===districtId);
    fillSelect(document.getElementById('filtreCommune'),'Toutes',list,preselect||'all');
  }

  async function loadFiltresPanel(){
    try {
      const response=await fetch(`${BASE}${FILTRES}`,{headers:auth()});
      const data=await response.json();
      if(!data.success)return;
      filtresData=data;
      fillSelect(document.getElementById('filtreEmploye'),'Moi-même et subordonnés',data.employes||[],selectedFiltres.employe);
      fillSelect(document.getElementById('filtreBase'),'Toutes',data.bases||[],selectedFiltres.base);
      fillSelect(document.getElementById('filtreRegion'),'Toutes',data.regions||[],selectedFiltres.region);
      refreshDistrictOptions(selectedFiltres.district);
      refreshCommuneOptions(selectedFiltres.commune);
      const typeSelect=document.getElementById('filtreType');
      typeSelect.innerHTML=(data.types_activite||[]).map(t=>`<option value="${t.id}" ${selectedFiltres.types.includes(t.id)?'selected':''}>${escapeHtml(t.nom)}</option>`).join('');

      document.getElementById('filtreEmploye').onchange=e=>{selectedFiltres.employe=e.target.value;persistFiltres();loadActivites();};
      document.getElementById('filtreBase').onchange=e=>{selectedFiltres.base=e.target.value;persistFiltres();loadActivites();};
      document.getElementById('filtreRegion').onchange=e=>{selectedFiltres.region=e.target.value;refreshDistrictOptions();refreshCommuneOptions();selectedFiltres.district='all';selectedFiltres.commune='all';persistFiltres();loadActivites();};
      document.getElementById('filtreDistrict').onchange=e=>{selectedFiltres.district=e.target.value;refreshCommuneOptions();selectedFiltres.commune='all';persistFiltres();loadActivites();};
      document.getElementById('filtreCommune').onchange=e=>{selectedFiltres.commune=e.target.value;persistFiltres();loadActivites();};
      typeSelect.onchange=()=>{selectedFiltres.types=Array.from(typeSelect.selectedOptions).map(o=>o.value);persistFiltres();loadActivites();};
    } catch(_){ /* filtres indisponibles : le widget continue sans filtre */ }
  }

  function showLogin(message='') {
    content.innerHTML=`<form class="login" id="login"><p>Connectez ce widget à votre compte Hydria. Le même jeton peut être partagé avec les autres widgets installés sur cet ordinateur.</p><input id="username" autocomplete="username" placeholder="Nom d’utilisateur" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><div class="error">${escapeHtml(message)}</div><button class="primary">Se connecter</button></form>`;
    document.getElementById('login').onsubmit=async event=>{
      event.preventDefault();
      const body=new URLSearchParams({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,device_label:'Widget Windows activités du jour'});
      try {
        const response=await fetch(`${BASE}/widget/api/login/`,{method:'POST',body});
        const data=await response.json();
        if(!data.success)return showLogin(data.error||'Identifiants invalides');
        token=data.token; window.widgetAPI.saveHydriaToken(token); loadFiltresPanel(); loadActivites();
      } catch(_){showLogin('Connexion réseau impossible');}
    };
  }
  function loading(){content.innerHTML='<div class="skeleton"></div>';}

  function statutBadge(item){
    return item.termine
      ? '<span class="badge termine">Terminé</span>'
      : '<span class="badge encours">En cours</span>';
  }

  function activiteCard(item){
    const heure = item.heure ? item.heure : 'Toute la journée';
    const metaParts=[heure, item.ouvrage, [item.employe,item.base,item.commune].filter(Boolean).join(' · ')].filter(Boolean);
    return `<article class="card"><div class="card-top"><h3 class="card-title">${escapeHtml(item.activite||'Activité')}</h3>${statutBadge(item)}</div><div class="card-meta">${metaParts.map(escapeHtml).join('<br>')}</div>${item.remarque?`<div class="card-note">${escapeHtml(item.remarque)}</div>`:''}</article>`;
  }

  function render(data){
    const items=(data.activites||[]).slice().sort((a,b)=>(a.heure||'').localeCompare(b.heure||''));
    let html=`<div class="counter-row"><span class="counter-label">Activités aujourd’hui</span><span class="counter">${items.length}</span></div>`;
    if(!items.length){
      html+='<div class="state"><strong>Journée libre</strong>Aucune activité planifiée aujourd’hui.</div>';
    } else {
      html+=items.map(activiteCard).join('');
    }
    html+=`<button class="secondary" id="openWeb">Modifier dans Hydria</button><div class="footer"><span>Actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
    content.innerHTML=html;
    document.getElementById('openWeb').onclick=()=>window.widgetAPI.openExternal(`${BASE}/widget/`);
  }

  async function loadActivites(){
    if(!token)return showLogin(); loading();
    try {
      const today=todayIso();
      const params=currentFiltreParams();
      params.set('debut',today); params.set('fin',today);
      const response=await fetch(`${BASE}${ACTIVITES}?${params}`,{headers:auth()});
      if(response.status===401||response.status===403){token=null;window.widgetAPI.clearHydriaToken();return showLogin('Session expirée');}
      const data=await response.json();
      if(!response.ok||!data.success)throw new Error(data.error||'Impossible de charger le planning');
      render(data);
    } catch(error){content.innerHTML=`<div class="state"><strong>Chargement impossible</strong>${escapeHtml(error.message||'Serveur Hydria indisponible')}<br><br><button class="secondary" id="retry">Réessayer</button></div>`;document.getElementById('retry').onclick=loadActivites;}
  }

  (async()=>{
    document.getElementById('startup').classList.toggle('active',await window.widgetAPI.getStartup());
    token=await window.widgetAPI.getHydriaToken();
    try {
      const saved=await window.widgetAPI.getPlanningFiltres();
      if(saved && typeof saved==='object'){
        selectedFiltres={
          employe: saved.employe||'all', base: saved.base||'all', region: saved.region||'all',
          district: saved.district||'all', commune: saved.commune||'all', types: Array.isArray(saved.types)?saved.types:[],
        };
      }
    } catch(_){}
    if(token) loadFiltresPanel();
    loadActivites();
  })();
  setInterval(()=>token&&loadActivites(),5*60*1000);
})();
</script>
</body>
</html>
