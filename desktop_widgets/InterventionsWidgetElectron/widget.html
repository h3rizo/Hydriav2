<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydria · Dernières réparations</title>
  <style>
    :root { color-scheme:dark; --ink:#f4f9fa; --muted:#9bb2b8; --accent:#78d6c6; --line:rgba(218,238,242,.14); --panel:rgba(255,255,255,.06); --danger:#ffc1b2; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; color:var(--ink); font-family:"Segoe UI Variable","Segoe UI",sans-serif; background:radial-gradient(circle at 12% 0%,rgba(77,160,150,.26),transparent 35%),linear-gradient(155deg,#12313a,#07171f 72%); }
    button,input { font:inherit; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .shell { height:100%; display:flex; flex-direction:column; }
    header { position:relative; padding:18px 18px 15px; border-bottom:1px solid var(--line); -webkit-app-region:drag; }
    .eyebrow { color:var(--accent); font-size:9px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:5px 112px 0 0; font-size:23px; line-height:1.08; letter-spacing:-.04em; }
    .subtitle { margin-top:7px; color:var(--muted); font-size:11px; }
    .controls { position:absolute; top:12px; right:12px; display:flex; gap:5px; -webkit-app-region:no-drag; }
    .icon { width:29px; height:29px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--panel); cursor:pointer; }
    .icon:hover { background:rgba(255,255,255,.13); transform:translateY(-1px); }
    .icon.active { color:var(--accent); border-color:rgba(120,214,198,.5); }
    main { min-height:0; flex:1; overflow-y:auto; padding:15px 17px 24px; scrollbar-width:thin; }
    .counter-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .counter-label { color:var(--muted); font-size:10px; letter-spacing:.05em; text-transform:uppercase; }
    .counter { min-width:42px; height:42px; display:grid; place-items:center; border-radius:50%; color:#08211d; background:var(--accent); font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
    .post { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.055); }
    .photo-strip { display:grid; grid-auto-flow:column; grid-auto-columns:84%; gap:7px; overflow-x:auto; padding:8px; scroll-snap-type:x mandatory; }
    .photo { position:relative; height:210px; overflow:hidden; border:0; border-radius:11px; padding:0; background:#10272f; cursor:zoom-in; scroll-snap-align:start; }
    .photo img { width:100%; height:100%; display:block; object-fit:cover; }
    .photo-index { position:absolute; right:8px; bottom:8px; padding:3px 7px; border-radius:999px; background:rgba(0,0,0,.66); color:#fff; font-size:9px; }
    .post-body { padding:15px; }
    .activity { margin:0; font-size:21px; line-height:1.15; letter-spacing:-.035em; }
    .ouvrage { margin-top:8px; color:var(--accent); font-size:14px; font-weight:700; }
    .meta { display:grid; gap:5px; margin-top:12px; color:var(--muted); font-size:11px; line-height:1.4; }
    .note { margin-top:14px; padding:12px; border-left:3px solid var(--accent); border-radius:0 9px 9px 0; background:rgba(0,0,0,.16); color:#d8e5e8; font-size:11px; line-height:1.55; }
    .actions { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:13px; }
    .primary,.secondary { min-height:43px; border-radius:10px; cursor:pointer; font-weight:750; }
    .primary { border:0; color:#08211d; background:var(--accent); }
    .primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .secondary { padding:0 14px; border:1px solid var(--line); color:var(--ink); background:var(--panel); }
    .state { padding:65px 22px; color:var(--muted); text-align:center; font-size:12px; line-height:1.6; }
    .state strong { display:block; margin-bottom:7px; color:var(--ink); font-size:17px; }
    .login { display:grid; gap:10px; margin-top:6px; }
    .login p { margin:0 0 5px; color:var(--muted); font-size:11px; line-height:1.5; }
    input { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:rgba(255,255,255,.08); }
    .error { min-height:16px; color:var(--danger); font-size:10px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; color:var(--muted); font-size:9px; }
    .link { border:0; padding:0; color:var(--accent); background:transparent; cursor:pointer; font-weight:700; }
    .lightbox { display:none; position:fixed; inset:0; z-index:20; padding:30px; align-items:center; justify-content:center; background:rgba(0,0,0,.94); cursor:zoom-out; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:100%; max-height:100%; object-fit:contain; }
    .skeleton { height:430px; border-radius:16px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.12),rgba(255,255,255,.04)); background-size:200% 100%; animation:shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">Hydria · surveillance</div>
    <h1>Dernières réparations</h1>
    <div class="subtitle">Une publication à la fois, sans rien manquer</div>
    <div class="controls">
      <button class="icon active" id="pin" title="Toujours au premier plan">◆</button>
      <button class="icon" id="startup" title="Lancer au démarrage de Windows">◉</button>
      <button class="icon" id="refresh" title="Actualiser">↻</button>
      <button class="icon" id="close" title="Fermer">×</button>
    </div>
  </header>
  <main id="content"><div class="state">Connexion à Hydria…</div></main>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo agrandie"><img id="lightboxImage" alt="Photo de la réparation"></div>
<script>
(() => {
  const BASE='https://www.hydria.mg';
  const QUEUE='/widget/api/interventions/';
  const SEEN='/widget/api/interventions/vue/';
  const content=document.getElementById('content');
  const lightbox=document.getElementById('lightbox');
  const lightboxImage=document.getElementById('lightboxImage');
  let token=null,current=null,lastUnseen=-1,objectUrls=[];
  const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const auth=()=>({Authorization:`Token ${token}`});
  const absolute=path=>new URL(path,BASE).href;
  document.getElementById('close').onclick=()=>window.widgetAPI.close();
  document.getElementById('refresh').onclick=()=>loadQueue();
  document.getElementById('pin').onclick=()=>window.widgetAPI.togglePin();
  document.getElementById('startup').onclick=async()=>document.getElementById('startup').classList.toggle('active',await window.widgetAPI.toggleStartup());
  window.widgetAPI.onPinState(value=>document.getElementById('pin').classList.toggle('active',value));
  window.widgetAPI.onForceRefresh(()=>loadQueue());
  lightbox.onclick=()=>{lightbox.classList.remove('open');lightboxImage.removeAttribute('src');};
  document.addEventListener('keydown',event=>{if(event.key==='Escape')lightbox.click();});

  function clearPhotos(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];}
  function showLogin(message='') {
    clearPhotos();
    content.innerHTML=`<form class="login" id="login"><p>Connectez ce widget à votre compte Hydria. Le même jeton peut être partagé avec les autres widgets installés sur cet ordinateur.</p><input id="username" autocomplete="username" placeholder="Nom d’utilisateur" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><div class="error">${escapeHtml(message)}</div><button class="primary">Se connecter</button></form>`;
    document.getElementById('login').onsubmit=async event=>{
      event.preventDefault();
      const body=new URLSearchParams({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,device_label:'Widget Windows interventions'});
      try {
        const response=await fetch(`${BASE}/widget/api/login/`,{method:'POST',body});
        const data=await response.json();
        if(!data.success)return showLogin(data.error||'Identifiants invalides');
        token=data.token; window.widgetAPI.saveHydriaToken(token); loadQueue();
      } catch(_){showLogin('Connexion réseau impossible');}
    };
  }
  function loading(){clearPhotos();content.innerHTML='<div class="skeleton"></div>';}
  function renderEmpty(data){
    current=null;clearPhotos();
    content.innerHTML=`<div class="counter-row"><span class="counter-label">Saisies depuis lundi</span><span class="counter">${Number(data.week_count??data.unseen_count??0)}</span></div><div class="state"><strong>Tout est vu</strong>Aucune nouvelle saisie de réparation dans votre file.<br>${Number(data.week_count??0)} publication(s) ont été saisie(s) cette semaine.</div><div class="footer"><span>Actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><button class="link" id="openFeed">Ouvrir le fil complet</button></div>`;
    document.getElementById('openFeed').onclick=()=>window.widgetAPI.openExternal(`${BASE}/recherche/ouvrages/interventions/recentes/`);
  }
  function render(data){
    current=data.current;
    if(!current)return renderEmpty(data);
    clearPhotos();
    const photos=(current.photos||[]).filter(photo=>!photo.is_video);
    const videos=(current.photos||[]).filter(photo=>photo.is_video);
    content.innerHTML=`<div class="counter-row"><span class="counter-label">Saisies depuis lundi</span><span class="counter">${Number(data.week_count??data.unseen_count??0)}</span></div><article class="post"><div class="photo-strip" id="photos">${photos.map((photo,index)=>`<button class="photo" data-photo="${escapeHtml(photo.url)}"><span class="photo-index">${index+1} / ${photos.length}</span></button>`).join('')}</div><div class="post-body"><h2 class="activity">${escapeHtml(current.activite||'Réparation')}</h2><div class="ouvrage">${escapeHtml(current.ouvrage||'Sans ouvrage')}</div><div class="meta"><span>Employé · ${escapeHtml(current.employe||'Non affecté')}${current.base?` · ${escapeHtml(current.base)}`:''}</span><span>Saisie · ${escapeHtml(current.date_saisie||'Date inconnue')}</span>${current.date_intervention?`<span>Intervention · ${escapeHtml(current.date_intervention)}</span>`:''}<span>${Number(data.unseen_count||0)} publication(s) non vue(s) dans votre file</span>${videos.length?`<span>${videos.length} vidéo(s) jointe(s) · visibles dans le fil complet</span>`:''}</div><div class="note">${escapeHtml(current.remarque||'Aucune remarque.')}</div><div class="actions"><button class="primary" id="seen">J’AI VU · SUIVANTE</button><button class="secondary" id="openFeed">Fil complet</button></div></div></article><div class="footer"><span>Actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><span>${escapeHtml(current.statut||'')}</span></div>`;
    document.getElementById('seen').onclick=markSeen;
    document.getElementById('openFeed').onclick=()=>window.widgetAPI.openExternal(`${BASE}/recherche/ouvrages/interventions/recentes/`);
    content.querySelectorAll('[data-photo]').forEach(loadPhoto);
  }
  async function loadPhoto(button){
    try {
      const response=await fetch(absolute(button.dataset.photo),{headers:auth()});
      if(!response.ok)throw new Error();
      const url=URL.createObjectURL(await response.blob()); objectUrls.push(url);
      button.insertAdjacentHTML('afterbegin',`<img src="${url}" alt="Photo de la réparation">`);
      button.onclick=()=>{lightboxImage.src=url;lightbox.classList.add('open');};
    } catch(_){button.innerHTML='<span class="photo-index">Photo indisponible</span>';}
  }
  function notifyIfNew(data){
    const count=Number(data.unseen_count||0);
    const latest=data.latest_event;
    const previousId=localStorage.getItem('hydria-last-intervention-event');
    if(latest?.id)localStorage.setItem('hydria-last-intervention-event',latest.id);
    if(previousId&&latest?.id&&previousId!==latest.id&&'Notification' in window){
      try{new Notification('Nouvelle réparation Hydria',{body:`${latest.activite} · ${latest.ouvrage}`});}catch(_){}
    }
    lastUnseen=count;
  }
  async function loadQueue(){
    if(!token)return showLogin(); loading();
    try {
      const response=await fetch(`${BASE}${QUEUE}`,{headers:auth()});
      if(response.status===401||response.status===403){token=null;window.widgetAPI.clearHydriaToken();return showLogin('Session expirée');}
      const data=await response.json();
      if(!response.ok||!data.success)throw new Error(data.error||'Impossible de charger les réparations');
      notifyIfNew(data); render(data);
    } catch(error){content.innerHTML=`<div class="state"><strong>Chargement impossible</strong>${escapeHtml(error.message||'Serveur Hydria indisponible')}<br><br><button class="secondary" id="retry">Réessayer</button></div>`;document.getElementById('retry').onclick=loadQueue;}
  }
  async function markSeen(){
    if(!current)return; const button=document.getElementById('seen'); button.disabled=true;button.textContent='CHARGEMENT…';
    try {
      const response=await fetch(`${BASE}${SEEN}`,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({planning_id:current.id})});
      const data=await response.json();
      if(!response.ok||!data.success)throw new Error(data.error||'Action impossible');
      lastUnseen=Number(data.unseen_count||0); render(data);
    } catch(error){button.disabled=false;button.textContent='RÉESSAYER';button.title=error.message;}
  }
  (async()=>{document.getElementById('startup').classList.toggle('active',await window.widgetAPI.getStartup());token=await window.widgetAPI.getHydriaToken();loadQueue();})();
  setInterval(()=>token&&loadQueue(),5*60*1000);
})();
</script>
</body>
</html>
