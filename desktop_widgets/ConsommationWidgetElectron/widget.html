<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydria · Analyse consommation</title>
  <style>
    :root { color-scheme: dark; --ink:#f3fbfd; --muted:#9fb7bf; --accent:#74c9b5; --warm:#d9b56f; --line:rgba(218,238,242,.14); --panel:rgba(255,255,255,.065); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; color:var(--ink); font-family:"Segoe UI Variable","Segoe UI",sans-serif; background:radial-gradient(circle at 12% 0%,rgba(75,149,157,.24),transparent 36%),linear-gradient(155deg,#122d38,#07171f 72%); }
    button,select,input { font:inherit; }
    button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .shell { height:100%; display:flex; flex-direction:column; }
    header { position:relative; padding:17px 18px 14px; border-bottom:1px solid var(--line); -webkit-app-region:drag; }
    .eyebrow { color:var(--accent); font-size:9px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:5px 92px 0 0; font-size:22px; line-height:1.08; letter-spacing:-.04em; }
    .subtitle { margin-top:6px; color:var(--muted); font-size:11px; }
    .window-controls { position:absolute; top:12px; right:12px; display:flex; gap:5px; -webkit-app-region:no-drag; }
    .icon { width:28px; height:28px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--panel); cursor:pointer; transition:.2s ease; }
    .icon:hover { transform:translateY(-1px); background:rgba(255,255,255,.13); }
    .icon:active { transform:scale(.97); }
    .icon.active { color:var(--accent); border-color:rgba(116,201,181,.48); }
    main { min-height:0; flex:1; overflow-y:auto; padding:13px 16px 22px; scrollbar-width:thin; }
    .filter-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; padding:9px 11px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--panel); cursor:pointer; }
    .filters { display:none; grid-template-columns:1fr 1fr; gap:9px; margin-top:8px; padding:11px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.13); }
    .filters.open { display:grid; }
    label { display:block; margin:0 0 4px 2px; color:var(--muted); font-size:9px; }
    select,input { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:rgba(255,255,255,.08); font-size:11px; }
    option { color:#10232b; background:#eef6f6; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .stat { padding:11px; min-height:78px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:var(--panel); text-align:left; cursor:pointer; transition:transform .2s ease,background .2s ease,border-color .2s ease; }
    .stat:hover { transform:translateY(-2px); background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.24); }
    .stat:active { transform:scale(.98); }
    .stat-value { font-size:24px; font-weight:650; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
    .stat-unit { color:var(--accent); font-size:10px; font-weight:650; }
    .stat-label { margin-top:8px; color:var(--muted); font-size:10px; }
    .charts { display:grid; gap:9px; margin-top:10px; }
    .chart { padding:11px 11px 8px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.045); }
    .chart-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; }
    .chart-title { font-size:11px; font-weight:650; }
    .chart-unit { color:var(--muted); font-size:9px; }
    canvas { display:block; width:100%; height:120px; }
    .foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:var(--muted); font-size:9px; }
    .link { padding:0; border:0; color:var(--accent); background:transparent; cursor:pointer; font-weight:650; }
    .state { padding:55px 20px; text-align:center; color:var(--muted); font-size:12px; line-height:1.5; }
    .login { display:grid; gap:9px; margin-top:12px; }
    .login p { margin:0 0 4px; color:var(--muted); font-size:11px; line-height:1.45; }
    .primary { padding:9px; border:0; border-radius:9px; color:#08211d; background:var(--accent); font-weight:700; cursor:pointer; }
    .error { min-height:14px; color:#ffc1b2; font-size:10px; }
    .skeleton { height:78px; border-radius:12px; background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.12),rgba(255,255,255,.04)); background-size:200% 100%; animation:shimmer 1.3s infinite; }
    .detail { display:none; position:absolute; inset:0; z-index:8; flex-direction:column; background:rgba(7,23,31,.985); backdrop-filter:blur(18px); }
    .detail.open { display:flex; }
    .detail-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); -webkit-app-region:no-drag; }
    .back-button { min-width:92px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--panel); cursor:pointer; font-size:11px; font-weight:700; -webkit-app-region:no-drag; }
    .back-button:hover { background:rgba(255,255,255,.14); }
    .back-button:active { transform:scale(.98); }
    .detail-title { min-width:0; flex:1; font-size:14px; font-weight:700; }
    .detail-body { min-height:0; flex:1; overflow-y:auto; padding:12px 16px 18px; }
    .detail-summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:13px; }
    .detail-summary div { padding:10px; border:1px solid var(--line); border-radius:11px; background:var(--panel); }
    .detail-summary strong { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
    .detail-summary span { display:block; margin-top:4px; color:var(--muted); font-size:9px; }
    .detail-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line); font-size:11px; }
    .detail-row strong { font-variant-numeric:tabular-nums; }
    .detail-row span:last-child { min-width:70px; color:var(--warm); text-align:right; }
    .detail-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:9px; }
    @keyframes shimmer { to { background-position:-200% 0; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="eyebrow">Hydria · volumétrique</div>
    <h1>Analyse de la consommation</h1>
    <div class="subtitle">Volumes et consommation par habitant</div>
    <div class="window-controls">
      <button class="icon active" id="pin" title="Toujours au premier plan">◆</button>
      <button class="icon" id="refresh" title="Actualiser">↻</button>
      <button class="icon" id="close" title="Fermer">×</button>
    </div>
  </header>
  <main>
    <button class="filter-toggle" id="filterToggle"><span>Filtres du périmètre</span><span id="filterChevron">▾</span></button>
    <section class="filters" id="filters">
      <div><label for="year">Année</label><input id="year" type="number" min="2020" max="2100"></div>
      <div><label for="organisation">Organisation</label><select id="organisation"><option value="all">Toutes</option></select></div>
      <div><label for="region">Région</label><select id="region"><option value="all">Toutes</option></select></div>
      <div><label for="district">District</label><select id="district"><option value="all">Tous</option></select></div>
      <div><label for="commune">Commune</label><select id="commune"><option value="all">Toutes</option></select></div>
    </section>
    <section id="content"><div class="state">Connexion à Hydria…</div></section>
  </main>
  <section class="detail" id="detailPanel" aria-hidden="true">
    <div class="detail-head">
      <button type="button" class="back-button" id="detailBack" aria-label="Retour au widget">← Retour</button>
      <div class="detail-title" id="detailTitle">Détail de la consommation</div>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-footer"><span id="detailCount"></span><button type="button" class="link" id="openFullPage">Ouvrir l’analyse complète</button></div>
  </section>
</div>
<script>
(() => {
  const BASE='https://www.hydria.mg';
  const ENDPOINT='/widget/api/analyse-consommation/';
  const content=document.getElementById('content');
  const filters=document.getElementById('filters');
  const detailPanel=document.getElementById('detailPanel');
  const detailBody=document.getElementById('detailBody');
  let token=null, filterData=null, lastData=null;
  document.getElementById('year').value=new Date().getFullYear();
  document.getElementById('close').onclick=()=>window.widgetAPI.close();
  document.getElementById('refresh').onclick=()=>loadData();
  document.getElementById('pin').onclick=()=>window.widgetAPI.togglePin();
  window.widgetAPI.onPinState(value=>document.getElementById('pin').classList.toggle('active',value));
  window.widgetAPI.onForceRefresh(()=>loadData());
  document.getElementById('filterToggle').onclick=()=>{ filters.classList.toggle('open'); document.getElementById('filterChevron').textContent=filters.classList.contains('open')?'▴':'▾'; };
  document.getElementById('detailBack').onclick=event=>{event.preventDefault();event.stopPropagation();closeDetail();};
  document.getElementById('openFullPage').onclick=()=>lastData?.full_url&&window.widgetAPI.openExternal(new URL(lastData.full_url,BASE).href);
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&detailPanel.classList.contains('open'))closeDetail();});
  document.addEventListener('mouseup',event=>{if(event.button===3&&detailPanel.classList.contains('open'))closeDetail();});
  const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const format=(value,digits=0)=>Number(value||0).toLocaleString('fr-FR',{maximumFractionDigits:digits,minimumFractionDigits:digits});
  const auth=()=>({headers:{Authorization:`Token ${token}`}});
  function params(){const p=new URLSearchParams({annee:document.getElementById('year').value});for(const id of ['region','district','commune']){const v=document.getElementById(id).value;if(v&&v!=='all')p.set(`${id}_id`,v);}const org=document.getElementById('organisation').value;if(org&&org!=='all')p.set('organisation',org);return p;}
  function showLogin(message=''){content.innerHTML=`<form class="login" id="login"><p>Connectez ce widget à votre compte Hydria. Les filtres restent ensuite disponibles dans le panneau repliable.</p><input id="username" autocomplete="username" placeholder="Nom d’utilisateur" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><div class="error">${escapeHtml(message)}</div><button class="primary">Se connecter</button></form>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const body=new URLSearchParams({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,device_label:'Analyse consommation'});try{const r=await fetch(`${BASE}/widget/api/login/`,{method:'POST',body});const d=await r.json();if(!d.success)return showLogin(d.error||'Identifiants invalides');token=d.token;window.widgetAPI.saveHydriaToken(token);await Promise.all([loadFilters(),loadData()]);}catch(_){showLogin('Connexion réseau impossible');}};}
  function loading(){content.innerHTML=`<div class="stats">${'<div class="skeleton"></div>'.repeat(4)}</div><div class="charts"><div class="skeleton"></div><div class="skeleton"></div></div>`;}
  function render(data){lastData=data;const s=data.stats||{};content.innerHTML=`<section class="stats"><button type="button" class="stat" data-detail><div class="stat-value">${format(s.nb_ouvrages)}</div><div class="stat-label">Ouvrages analysés</div></button><button type="button" class="stat" data-detail><div class="stat-value">${format(s.population)}</div><div class="stat-label">Population estimée</div></button><button type="button" class="stat" data-detail><div class="stat-value">${format(s.volume_consomme,1)} <span class="stat-unit">m³</span></div><div class="stat-label">Volume consommé</div></button><button type="button" class="stat" data-detail><div class="stat-value">${format(s.conso_hab_jour,1)} <span class="stat-unit">L</span></div><div class="stat-label">Consommation / hab. / jour</div></button></section><section class="charts"><article class="chart"><div class="chart-head"><span class="chart-title">Volume consommé par mois</span><span class="chart-unit">m³</span></div><canvas id="volumeChart"></canvas></article><article class="chart"><div class="chart-head"><span class="chart-title">Consommation par habitant par jour</span><span class="chart-unit">L / hab. / jour</span></div><canvas id="consoChart"></canvas></article></section><div class="foot"><span>${data.annee} · actualisé ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><button class="link" id="openPage">Voir les détails</button></div>`;content.querySelectorAll('[data-detail]').forEach(button=>button.onclick=openDetail);document.getElementById('openPage').onclick=openDetail;drawCharts();}
  function openDetail(){if(!lastData)return;const s=lastData.stats||{},charts=lastData.charts||{},labels=charts.labels||[],volumes=charts.volumes||[],conso=charts.conso_hab||[];document.getElementById('detailTitle').textContent=`Détail de la consommation · ${lastData.annee}`;detailBody.innerHTML=`<div class="detail-summary"><div><strong>${format(s.nb_ouvrages)}</strong><span>Ouvrages analysés</span></div><div><strong>${format(s.population)}</strong><span>Population estimée</span></div><div><strong>${format(s.volume_consomme,1)} m³</strong><span>Volume consommé</span></div><div><strong>${format(s.conso_hab_jour,1)} L</strong><span>Consommation / hab. / jour</span></div></div>${labels.map((label,index)=>`<div class="detail-row"><strong>${escapeHtml(label)}</strong><span>${format(volumes[index],1)} m³</span><span>${format(conso[index],1)} L/hab/j</span></div>`).join('')||'<div class="state">Aucune donnée mensuelle.</div>'}`;document.getElementById('detailCount').textContent=`${labels.length} mois affiché(s)`;detailPanel.classList.add('open');detailPanel.setAttribute('aria-hidden','false');document.getElementById('detailBack').focus();}
  function closeDetail(){detailPanel.classList.remove('open');detailPanel.setAttribute('aria-hidden','true');detailBody.innerHTML='';}
  function drawChart(canvas,labels,values,type){const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:31,r:7,t:15,b:21},max=Math.max(...values.map(Number),1);c.strokeStyle='rgba(220,239,243,.12)';c.lineWidth=1;for(let i=0;i<3;i++){const y=p.t+(h-p.t-p.b)*i/2;c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke();}c.font='8px Segoe UI';c.fillStyle='rgba(210,231,236,.58)';c.textAlign='center';const step=(w-p.l-p.r)/Math.max(values.length,1);labels.forEach((label,i)=>c.fillText(label,p.l+step*(i+.5),h-5));if(type==='bars'){values.forEach((value,i)=>{const numeric=Number(value),bh=(numeric/max)*(h-p.t-p.b),x=p.l+step*i+step*.2,y=h-p.b-bh;c.fillStyle='rgba(116,201,181,.78)';c.fillRect(x,y,step*.6,bh);c.fillStyle='#f3fbfd';c.font='7px Segoe UI';c.fillText(numeric.toLocaleString('fr-FR',{maximumFractionDigits:1}),x+step*.3,Math.max(8,y-3));});}else{c.strokeStyle='#d9b56f';c.lineWidth=2;c.beginPath();values.forEach((value,i)=>{const x=p.l+step*(i+.5),y=h-p.b-(Number(value)/max)*(h-p.t-p.b);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();values.forEach((value,i)=>{const numeric=Number(value),x=p.l+step*(i+.5),y=h-p.b-(numeric/max)*(h-p.t-p.b);c.fillStyle='#d9b56f';c.beginPath();c.arc(x,y,2.2,0,Math.PI*2);c.fill();c.fillStyle='#f3fbfd';c.font='7px Segoe UI';c.fillText(numeric.toLocaleString('fr-FR',{maximumFractionDigits:1}),x,Math.max(8,y-4));});}}
  function drawCharts(){if(!lastData)return;drawChart(document.getElementById('volumeChart'),lastData.charts.labels,lastData.charts.volumes,'bars');drawChart(document.getElementById('consoChart'),lastData.charts.labels,lastData.charts.conso_hab,'line');}
  async function loadData(){if(!token)return showLogin();loading();try{const r=await fetch(`${BASE}${ENDPOINT}?${params()}`,auth());if(r.status===401||r.status===403){token=null;window.widgetAPI.clearHydriaToken();return showLogin('Session expirée');}const d=await r.json();if(!d.success)throw new Error(d.error||'Données indisponibles');render(d);}catch(e){content.innerHTML=`<div class="state">${escapeHtml(e.message||'Serveur Hydria indisponible')}<br>Vérifiez que l’API du widget a été déployée.</div>`;}}
  function setOptions(el,rows,label){const current=el.value;el.innerHTML=`<option value="all">${label}</option>`+rows.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.nom)}</option>`).join('');if([...el.options].some(o=>o.value===current))el.value=current;}
  async function loadFilters(){if(!token||filterData)return;try{const r=await fetch(`${BASE}/widget/api/filtres/`,auth());const d=await r.json();if(!d.success)return;filterData=d;setOptions(document.getElementById('organisation'),d.organisations||[],'Toutes');setOptions(document.getElementById('region'),d.regions||[],'Toutes');setOptions(document.getElementById('district'),d.districts||[],'Tous');setOptions(document.getElementById('commune'),d.communes||[],'Toutes');if(d.default_organisation_id)document.getElementById('organisation').value=d.default_organisation_id;document.getElementById('region').onchange=()=>{const id=document.getElementById('region').value;setOptions(document.getElementById('district'),id==='all'?d.districts:d.districts.filter(x=>x.region_id===id),'Tous');setOptions(document.getElementById('commune'),d.communes,'Toutes');loadData();};document.getElementById('district').onchange=()=>{const id=document.getElementById('district').value;setOptions(document.getElementById('commune'),id==='all'?d.communes:d.communes.filter(x=>x.district_id===id),'Toutes');loadData();};for(const id of ['year','organisation','commune'])document.getElementById(id).onchange=()=>loadData();}catch(_){}}
  window.addEventListener('resize',()=>requestAnimationFrame(drawCharts));
  (async()=>{token=await window.widgetAPI.getHydriaToken();if(!token)return showLogin();await Promise.all([loadFilters(),loadData()]);})();
  setInterval(()=>token&&loadData(),10*60*1000);
})();
</script>
</body>
</html>
