<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hydria Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #071d25;
    color-scheme: dark;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 14px 10px;
    overflow-y: auto;
  }

  /* ---------- Thème commun aux widgets Hydria ----------
     Fond OPAQUE teal sombre, identique aux autres widgets (Planning, Consommation...).
     L'ancien rendu « liquid glass » reposait sur un fond transparent + le flou natif
     Windows (acrylic) : quand Windows ne l'applique pas (effets de transparence
     désactivés, économiseur de batterie, bureau à distance, pilote graphique...),
     la fenêtre restait blanche, donc texte blanc sur fond blanc. */
  html { background: #071d25; }
  body {
    background:
      radial-gradient(circle at 12% 0%, rgba(77,160,150,.26), transparent 35%),
      linear-gradient(155deg, #12313a, #07171f 72%);
  }

  #widget {
    width: 300px;
    border-radius: 24px;
    padding: 16px 20px 16px;
    color: #fff;
    position: relative;
    cursor: grab;
    overflow: hidden;
    isolation: isolate;

    /* Verre neutre translucide : le vrai flou du bureau vient du
       backgroundMaterial 'acrylic' cote Electron (main.js). Cette
       couche ne fait qu'ajouter la teinte de verre + le liseré. */
    background: linear-gradient(
      165deg,
      rgba(255,255,255,0.10),
      rgba(255,255,255,0.04) 40%,
      rgba(255,255,255,0.06) 100%
    );

    border: 1px solid rgba(218,238,242,0.18);
    box-shadow:
      0 12px 34px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 0 0 1px rgba(255,255,255,0.03);

    transition: box-shadow 0.3s ease, border-color 0.5s ease;
  }
  #widget.dragging { cursor: grabbing; }

  /* Reflet diagonal type verre, purement decoratif */
  #widget::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(
      120deg,
      rgba(255,255,255,0.12) 0%,
      rgba(255,255,255,0.03) 22%,
      rgba(255,255,255,0) 45%
    );
    mix-blend-mode: screen;
  }

  /* Halo bas, colore selon la meteo, discret — garde un indice visuel
     sans repeindre tout le fond en couleur pleine. */
  #widget::after {
    content: '';
    position: absolute;
    left: -20%; right: -20%; bottom: -40%;
    height: 60%;
    z-index: -1;
    filter: blur(30px);
    opacity: 0.55;
    background: radial-gradient(ellipse at center, var(--accent, #4facfe) 0%, transparent 70%);
    transition: background 0.6s ease;
  }

  #widget.clear   { --accent: #4facfe; }
  #widget.cloudy  { --accent: #9aa5b1; }
  #widget.rain    { --accent: #4d7ea8; }
  #widget.storm   { --accent: #6b5b95; }
  #widget.snow    { --accent: #cfe8ff; }
  #widget.night   { --accent: #3f5efb; }

  #dragHandle {
    position: absolute;
    top: 0; left: 0; right: 0; height: 100%;
    z-index: 1;
  }

  #controls {
    position: absolute;
    top: 10px; right: 12px;
    z-index: 3;
    display: flex;
    gap: 6px;
  }
  #controls button {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.25);
    color: inherit;
    width: 24px; height: 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    padding: 0;
    -webkit-app-region: no-drag;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #controls button:hover { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.4); }
  #controls button.active { background: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.6); }

  .content { position: relative; z-index: 2; pointer-events: none; }

  /* Météo retirée (1.15.0) : le bloc météo est masqué pour laisser toute la
     hauteur aux stats. #widget devient une simple barre de déplacement /
     contrôles ; #dragHandle et #controls restent fonctionnels. */
  #widget { padding: 0; height: 40px; }
  #widget .content { display: none; }
  #widget .bar-hint {
    position: relative; z-index: 2; pointer-events: none;
    line-height: 40px; padding-left: 16px;
    font-size: 11px; font-weight: 600; opacity: 0.6;
  }
  #controls { top: 8px; }

  /* --- Ville : bien visible, en haut --- */
  .city-block {
    padding-right: 60px;
    margin-bottom: 12px;
  }
  .city-name {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .city-region {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .updated {
    font-size: 10.5px;
    opacity: 0.6;
    margin-bottom: 2px;
  }

  .source-badge {
    font-size: 10px;
    opacity: 0.75;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .source-badge.gps { color: #b9ffcb; }
  .source-badge.ip { color: #ffe0a3; }
  .source-badge u { text-decoration: underline dotted; }

  .main-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon { font-size: 54px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }

  .temp { font-size: 46px; font-weight: 300; line-height: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.25); }
  .temp sup { font-size: 20px; font-weight: 300; opacity: 0.9; }

  .desc { font-size: 13.5px; opacity: 0.92; margin-top: 2px; text-transform: capitalize; }

  .feels { font-size: 11.5px; opacity: 0.7; margin-top: 1px; }

  .details {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-size: 12px;
  }
  .details .item { text-align: center; opacity: 0.9; }
  .details .item .label { font-size: 9.5px; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.5px; }
  .details .item .value { font-weight: 600; margin-top: 2px; }

  #status {
    font-size: 13px;
    opacity: 0.9;
    padding: 40px 0;
    text-align: center;
  }

  #errorBox {
    display: none;
    font-size: 11px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 10px;
    line-height: 1.4;
  }
  #errorBox button {
    margin-top: 6px;
    background: rgba(255,255,255,0.25);
    border: none;
    color: inherit;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    pointer-events: all;
    -webkit-app-region: no-drag;
  }

  /* ---------- Carte stats Hydria (même verre, hors du widget météo
     donc pas de conflit avec le drag custom) ---------- */
  #hydriaCard {
    width: 300px;
    border-radius: 24px;
    padding: 10px 12px 8px;
    color: #fff;
    position: relative;
    overflow: hidden;
    cursor: default;

    background: linear-gradient(
      165deg,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0.04) 40%,
      rgba(255,255,255,0.05) 100%
    );
    border: 1px solid rgba(218,238,242,0.16);
    box-shadow:
      0 10px 28px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }

  #hydriaCard .hydria-title {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.9;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #perimetreSummary {
    font-size: 9px;
    opacity: 0.65;
    margin: 0 0 6px;
    line-height: 1.2;
    text-wrap: balance;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .stat-section { margin-top: 6px; }
  .stat-section-title {
    margin: 0 2px 3px;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  .stat-tile {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .stat-tile .stat-value { font-size: 16px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
  .stat-tile .stat-label { font-size: 8.5px; opacity: 0.78; margin-top: 2px; line-height: 1.12; text-wrap: balance; }
  .stat-tile .stat-amount { margin-top: 2px; font-size: 9px; font-weight: 750; color: #b9f3df; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stat-tile .stat-scope { margin-top: 2px; font-size: 9px; line-height: 1.2; opacity: .85; }
  .stat-tile .stat-scope strong { font-size: 10px; font-weight: 800; opacity: 1; }
  .stat-tile.wide { grid-column: span 2; display: flex; align-items: center; justify-content: space-between; }
  .stat-tile.wide .stat-value { font-size: 15px; }
  .stat-tile.alert .stat-value { color: #ffd27a; }
  .stat-section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 3px; }
  .stat-section-head .stat-section-title { margin: 0; }
  .periode-switch { display: inline-flex; gap: 2px; }
  .periode-switch button {
    font: inherit; font-size: 8.5px; font-weight: 800; color: inherit; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22); background: transparent; border-radius: 5px; padding: 1px 6px;
  }
  .periode-switch button.active { background: rgba(255,255,255,0.22); }
  .stat-tile.done .stat-value { color: #b9f3df; }
  .stat-delta { margin-top: 2px; font-size: 8.5px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .stat-delta.up { color: #b9f3df; }
  .stat-delta.down { color: #ffd27a; }
  .stat-delta.same { opacity: .7; }
  .realisations-note { font-size: 8.5px; opacity: .65; margin: 3px 2px 0; }

  #hydriaStatus { font-size: 10px; opacity: 0.85; padding: 4px 0; text-align: center; }
  #hydriaImportStatus { font-size: 9px; color: #b9f3df; padding: 0 0 4px; text-align: center; }

  #loginForm { display: flex; flex-direction: column; gap: 8px; }
  #loginForm input {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 10px;
    padding: 8px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  #loginForm input::placeholder { color: rgba(255,255,255,0.6); }
  #loginForm button {
    background: rgba(255,255,255,0.28);
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #loginForm button:hover { background: rgba(255,255,255,0.4); }
  #loginError { font-size: 11px; color: #ffb4b4; min-height: 14px; }
  #logoutLink {
    font-size: 9px;
    opacity: 0.6;
    text-align: right;
    margin-top: 5px;
    cursor: pointer;
    text-decoration: underline dotted;
  }

  .stat-tile {
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .stat-tile:hover { background: rgba(255,255,255,0.15); }
  .stat-tile:active { transform: scale(0.98); }

  /* ---------- Filtres pliables ---------- */
  #filtresToggle {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 5px 8px;
    color: inherit;
    font-family: inherit;
    font-size: 9.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #filtresPanel {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
  }
  #filtresPanel.open { display: flex; }
  #filtresPanel select {
    width: 100%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 6px 8px;
    color: #fff;
    font-size: 12px;
  }
  #filtresPanel select option { color: #1b1b1b; }
  #filtresPanel label { font-size: 10px; opacity: 0.7; margin-bottom: 2px; display: block; }

  /* ---------- Modal détail ---------- */
  #detailOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-app-region: no-drag;
  }
  #detailOverlay.open { display: flex; }
  #detailModal {
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 18px;
    padding: 14px 16px;
    background: linear-gradient(165deg, rgba(18,49,58,0.98), rgba(7,23,31,0.99));
    border: 1px solid rgba(218,238,242,0.18);
    color: #fff;
  }
  #detailModal .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  #detailModal .detail-title { font-size: 13px; font-weight: 700; }
  #detailModal .detail-close {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 24px; height: 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  #detailModal .detail-row {
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  #detailModal .detail-row:last-child { border-bottom: none; }
  #detailModal .detail-row .row-label { font-weight: 600; }
  #detailModal .detail-group-header { position: sticky; top: 0; padding: 6px 0 4px; margin-top: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; border-bottom: 1px solid rgba(255,255,255,0.25); background: inherit; }
  #detailModal .detail-group-header span { opacity: .7; font-weight: 400; }
  #detailModal .detail-row .row-sub { font-size: 10.5px; opacity: 0.7; margin-top: 2px; }
  #detailModal .detail-row.row-clickable {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 -6px;
    padding-left: 6px;
    padding-right: 6px;
    border-radius: 8px;
    transition: background 120ms ease;
  }
  #detailModal .detail-row.row-clickable:hover,
  #detailModal .detail-row.row-clickable:active { background: rgba(255,255,255,0.08); }
  #detailModal .detail-row .row-link-icon { opacity: 0.55; font-size: 11px; flex-shrink: 0; }
  #detailModal .row-idxls { display: inline-block; min-width: 26px; margin-right: 6px; padding: 0 5px; border-radius: 6px; background: rgba(255,255,255,0.16); font-size: 10.5px; font-weight: 700; text-align: center; opacity: .9; }
  #detailModal .detail-link { color: #9ecbff; text-decoration: underline; cursor: pointer; }
  #detailModal .detail-empty { text-align: center; opacity: 0.7; font-size: 12px; padding: 16px 0; }
  #detailModal .detail-footer { font-size: 10px; opacity: 0.6; text-align: center; margin-top: 8px; }
  #detailModal .detail-total { font-size: 10.5px; opacity: 0.65; margin-bottom: 8px; }
  #detailModal .detail-back { cursor: pointer; margin-right: 4px; opacity: 0.8; }

  .geo-district { margin-bottom: 6px; }
  .geo-district-toggle {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 7px 9px;
    color: inherit;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .geo-district-toggle:hover { background: rgba(255,255,255,0.12); }
  .geo-count { font-size: 10.5px; opacity: 0.75; display: inline-flex; align-items: center; gap: 4px; }
  .geo-caret { transition: transform 0.15s ease; display: inline-block; }
  .geo-district-toggle.open .geo-caret { transform: rotate(180deg); }
  .geo-communes { display: none; flex-direction: column; padding: 4px 0 4px 10px; }
  .geo-communes.open { display: flex; }
  .geo-commune-row {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 6px 5px;
    color: inherit;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    text-align: left;
  }
  .geo-commune-row:hover { background: rgba(255,255,255,0.08); }
  .geo-commune-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="widget">
  <div id="dragHandle"></div>
  <div id="controls">
    <button type="button" id="pinBtn" title="Toujours au premier plan">📌</button>
    <button type="button" id="refreshBtn" title="Actualiser">⟳</button>
    <button type="button" id="closeBtn" title="Fermer">✕</button>
  </div>

  <div class="bar-hint">⠿ Glisser pour déplacer</div>
  <div class="content" id="content">
    <div id="status">Localisation en cours…</div>
  </div>
</div>

<div id="hydriaCard">
  <div class="hydria-title">💧 Hydria</div>
  <div id="perimetreSummary">Tous les périmètres</div>

  <button type="button" id="filtresToggle">
    <span>🔎 Filtres</span>
    <span id="filtresToggleIcon">▾</span>
  </button>
  <div id="filtresPanel">
    <div>
      <label for="filtreOrganisation">Organisation</label>
      <select id="filtreOrganisation"></select>
    </div>
    <div>
      <label for="filtreEmploye">Employé responsable</label>
      <select id="filtreEmploye"><option value="all">Tous les agents de recouvrement</option></select>
    </div>
    <div>
      <label for="filtreRegion">Région</label>
      <select id="filtreRegion"><option value="all">Toutes</option></select>
    </div>
    <div>
      <label for="filtreDistrict">District</label>
      <select id="filtreDistrict"><option value="all">Tous</option></select>
    </div>
    <div>
      <label for="filtreCommune">Commune</label>
      <select id="filtreCommune"><option value="all">Toutes</option></select>
    </div>
  </div>

  <div id="hydriaContent">
    <div id="hydriaStatus">Chargement…</div>
  </div>
</div>

<div id="detailOverlay">
  <div id="detailModal">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle">Détail</div>
      <button type="button" class="detail-close" id="detailClose">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<script>
(function () {
  const widget = document.getElementById('widget');
  const content = document.getElementById('content');
  const dragHandle = document.getElementById('dragHandle');
  const hasNativeDrag = !!(window.widgetAPI && window.widgetAPI.drag);

  // ---------- Ajustement automatique de la hauteur de fenêtre ----------
  // Le contenu (météo + carte Hydria) varie selon l'état (chargement,
  // formulaire de connexion, grille de stats), donc une hauteur fixe
  // laisse soit du vide, soit tronque. On mesure et on redimensionne
  // après chaque changement de contenu, avec un léger debounce.
  if (hasNativeDrag) {
    let resizeTimeout = null;
    const syncWindowSize = () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        // requestAnimationFrame x2 : laisse Chromium terminer le layout
        // et le paint du DOM modifié avant de mesurer scrollHeight,
        // sinon la mesure peut être prise sur un état intermédiaire.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const h = document.body.scrollHeight;
            window.widgetAPI.resize(h);
          });
        });
      }, 150);
    };
    const observer = new MutationObserver(syncWindowSize);
    observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true });
    window.addEventListener('load', syncWindowSize);
    window.expose_syncWindowSize = syncWindowSize;
  }

  // ---------- Dragging (via Electron main process) ----------
  let dragging = false;
  let lastScreenX = 0, lastScreenY = 0;

  dragHandle.addEventListener('mousedown', (e) => {
    dragging = true;
    widget.classList.add('dragging');
    lastScreenX = e.screenX;
    lastScreenY = e.screenY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const deltaX = e.screenX - lastScreenX;
    const deltaY = e.screenY - lastScreenY;
    lastScreenX = e.screenX;
    lastScreenY = e.screenY;
    if (hasNativeDrag) {
      window.widgetAPI.drag(deltaX, deltaY);
    }
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    widget.classList.remove('dragging');
  });

  document.getElementById('closeBtn').addEventListener('click', () => {
    if (hasNativeDrag) window.widgetAPI.close();
    else window.close();
  });
  document.getElementById('refreshBtn').addEventListener('click', () => {
    init();
    if (currentHydriaToken) loadHydriaStats(currentHydriaToken);
  });

  async function reverseGeocode(lat, lon) {
    // Source principale : BigDataCloud (gratuit, sans clé)
    try {
      const r = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`
      );
      const d = await r.json();
      const cityName = d.city || d.locality || d.principalSubdivision;
      if (cityName) {
        return {
          city: cityName,
          region: [d.principalSubdivision, d.countryName].filter(Boolean).join(', ')
        };
      }
    } catch (e) {}

    // Repli : Nominatim (OpenStreetMap)
    try {
      const r2 = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=fr`,
        { headers: { 'Accept': 'application/json' } }
      );
      const d2 = await r2.json();
      const addr = d2.address || {};
      const cityName = addr.city || addr.town || addr.village || addr.suburb || addr.county;
      if (cityName) {
        return {
          city: cityName,
          region: [addr.state, addr.country].filter(Boolean).join(', ')
        };
      }
    } catch (e) {}

    return { city: `${lat.toFixed(2)}, ${lon.toFixed(2)}`, region: '' };
  }

  async function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day` +
      `&timezone=auto`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Réponse API invalide');
    return r.json();
  }

  function render(place, w, source) {
    const cur = w.current;
    const info = mapWeather(cur.weather_code, cur.is_day === 1);
    setThemeClass(info.cls);

    const now = new Date();
    const timeStr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    const sourceLabel = source === 'gps'
      ? '📡 Position GPS précise'
      : '🌐 Position approximative (IP) — cliquer pour réessayer le GPS';
    const sourceCls = source === 'gps' ? 'gps' : 'ip';

    content.innerHTML = `
      <div class="city-block">
        <div class="city-name">📍 ${place.city}</div>
        ${place.region ? `<div class="city-region">${place.region}</div>` : ''}
      </div>
      <div class="updated">Mis à jour à ${timeStr}</div>
      <div class="source-badge ${sourceCls}" id="sourceBadge" title="${sourceLabel}"><u>${sourceLabel}</u></div>
      <div class="main-row">
        <div class="icon">${info.icon}</div>
        <div>
          <div class="temp">${Math.round(cur.temperature_2m)}<sup>°C</sup></div>
          <div class="desc">${info.desc}</div>
          <div class="feels">Ressenti ${Math.round(cur.apparent_temperature)}°C</div>
        </div>
      </div>
      <div class="details">
        <div class="item">
          <div class="label">Humidité</div>
          <div class="value">${cur.relative_humidity_2m}%</div>
        </div>
        <div class="item">
          <div class="label">Vent</div>
          <div class="value">${Math.round(cur.wind_speed_10m)} km/h</div>
        </div>
      </div>
    `;
  }

  async function loadForCoords(lat, lon, source) {
    showStatus('Chargement de la météo…');
    const [place, weather] = await Promise.all([
      reverseGeocode(lat, lon),
      fetchWeather(lat, lon)
    ]);
    render(place, weather, source);
    const badge = document.getElementById('sourceBadge');
    if (badge) badge.addEventListener('click', () => init(true));
    try {
      localStorage.setItem('weather-widget-lastcoords', JSON.stringify({ lat, lon }));
    } catch (e) {}
  }

  async function ipFallback(reason) {
    if (reason) console.warn('[Widget Météo] GPS indisponible, repli sur IP. Raison:', reason);
    showStatus('Localisation via IP…');
    try {
      const r = await fetch('https://ipapi.co/json/');
      const d = await r.json();
      if (d && d.latitude && d.longitude) {
        await loadForCoords(d.latitude, d.longitude, 'ip');
        return;
      }
      throw new Error('IP lookup vide');
    } catch (e) {
      try {
        const cached = JSON.parse(localStorage.getItem('weather-widget-lastcoords'));
        if (cached) { await loadForCoords(cached.lat, cached.lon, 'ip'); return; }
      } catch (e2) {}
      await loadForCoords(-18.8792, 47.5079, 'ip'); // Antananarivo (secours ultime)
    }
  }

  function geoErrorReason(err) {
    // err.code : 1 = PERMISSION_DENIED, 2 = POSITION_UNAVAILABLE, 3 = TIMEOUT
    if (!err) return 'inconnue';
    if (err.code === 1) return 'permission refusée (vérifier Windows > Confidentialité > Localisation, et autoriser l’app)';
    if (err.code === 2) return 'position indisponible (service de localisation Windows désactivé, ou pas de matériel GPS/Wi-Fi de positionnement)';
    if (err.code === 3) return 'délai dépassé';
    return err.message || 'inconnue';
  }

  function init(forceGps) {
    // Météo retirée : aucune géolocalisation ni appel réseau météo.
    return;
    if (!navigator.geolocation) { ipFallback('API geolocation absente'); return; }

    showStatus('Localisation GPS en cours…');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadForCoords(pos.coords.latitude, pos.coords.longitude, 'gps').catch((e) => ipFallback('échec chargement météo: ' + e)),
      (err) => ipFallback(geoErrorReason(err)),
      { timeout: 8000, maximumAge: forceGps ? 0 : 600000, enableHighAccuracy: !!forceGps }
    );
  }

  function renderRealisations(data) {
    const section = document.getElementById('realisationsSection');
    if (!section) return;
    const periode = data.periode;
    const fmt = value => Number(value || 0).toLocaleString('fr-FR');
    const formatKAr = value => `${(Number(value || 0) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} K Ar`;
    const delta = bloc => {
      const diff = Number(bloc.courant || 0) - Number(bloc.precedent || 0);
      const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'same');
      const arrow = diff > 0 ? '▲ +' : (diff < 0 ? '▼ −' : '= ');
      return `<div class="stat-delta ${cls}">${arrow}${fmt(Math.abs(diff))} vs ${PERIODES[periode].precedent} (${fmt(bloc.precedent)})</div>`;
    };
    const items = REALISATIONS_DEFS.filter(def => {
      const bloc = data.compteurs[def.key];
      return bloc && (Number(bloc.courant) > 0 || Number(bloc.precedent) > 0);
    });
    const tiles = items.map(def => {
      const bloc = data.compteurs[def.key];
      return `
        <div class="stat-tile done">
          <div class="stat-value">${fmt(bloc.courant)}</div>
          <div class="stat-text">
            <div class="stat-label">${def.icon} ${def.label}</div>
            ${def.amount ? `<div class="stat-amount">${formatKAr(bloc.montant)}</div>` : ''}
            ${delta(bloc)}
          </div>
        </div>`;
    }).join('');
    const suivi = data.suivi_depuis
      ? `Suivi depuis le ${new Date(data.suivi_depuis).toLocaleDateString('fr-FR')}`

        <div class="stat-section-title">${PERIODES[periode].titre}</div>

    `;

      btn.addEventListener('click', () => {
        try { localStorage.setItem('hydria-realisations-periode', btn.dataset.periode); } catch (_) {}
        loadRealisations(currentHydriaToken);
      });
    });
  }

    diamex_707401_avec_scan_non_pointes: 'DiameX volume à pointer',
    factures_forfaitaires_a_collecter_aujourdhui: "Forfaits à collecter aujourd'hui",
  };

  function notifyPaymentChanges(stats) {
    if (!hasNativeDrag || typeof window.widgetAPI.notify !== 'function') return;
    const scopeKey = currentFiltreParams().toString() || 'all';
    const storageKey = `hydria-payment-snapshot:${scopeKey}`;
    const current = Object.fromEntries(
      Object.keys(PAYMENT_NOTIFICATION_KEYS).map(key => [key, Number(stats[key] || 0)])
    );
    let previous = null;
    try { previous = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch (_) {}
    localStorage.setItem(storageKey, JSON.stringify(current));
    if (!previous) return;
    const changes = Object.entries(PAYMENT_NOTIFICATION_KEYS).flatMap(([key, label]) =>
      Number(previous[key] || 0) === current[key]
        ? []
        : [`${typeof label === 'function' ? label() : label} : ${Number(previous[key] || 0)} → ${current[key]}`]
    );
    if (!changes.length) return;
    const body = changes.slice(0, 3).join(' · ') +
      (changes.length > 3 ? ` · +${changes.length - 3} autre(s)` : '');
    window.widgetAPI.notify('Paiements Hydria actualisés', body);
  }

  function currentFiltreParams() {
    const params = new URLSearchParams();
    const org = document.getElementById('filtreOrganisation')?.value;
    const employe = document.getElementById('filtreEmploye')?.value;
    const region = document.getElementById('filtreRegion')?.value;
    const district = document.getElementById('filtreDistrict')?.value;
    const commune = document.getElementById('filtreCommune')?.value;
    if (org && org !== 'all') params.set('organisation', org);
    if (employe && employe !== 'all') params.set('employe_id', employe);
    if (region && region !== 'all') params.set('region_id', region);
    if (district && district !== 'all') params.set('district_id', district);
    if (commune && commune !== 'all') params.set('commune_id', commune);
    return params;
  }

  function renderHydriaStats(stats, lastDiamexImport) {
    const splitStatsAvailable = Object.prototype.hasOwnProperty.call(stats, 'factures_volumetriques_mises_a_jour_mois_courant_non_pointees')
      && Object.prototype.hasOwnProperty.call(stats, 'diamex_707401_avec_scan_non_pointes')
      && Object.prototype.hasOwnProperty.call(stats, 'diamex_748411_sans_scan_non_pointes');
    const visibleDefs = defs => defs.filter(def => Number(stats[def.key] || 0) > 0);
    const statLabel = def => typeof def.label === 'function' ? def.label() : def.label;
    const formatKAr = value => `${(Number(value || 0) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} K Ar`;
    const has = key => Object.prototype.hasOwnProperty.call(stats, key);
    const fmt = value => Number(value || 0).toLocaleString('fr-FR');
    const plural = (n, one, many) => `${fmt(n)} ${Number(n) > 1 ? many : one}`;
    // L'ouvrage d'abord (repère principal), puis les points d'eau.
    const scopeHtml = def => {
      if (def.breakdown) {
        const parts = def.breakdown.filter(([, key]) => has(key) && Number(stats[key]) > 0).map(([label, key]) => `${label} <strong>${fmt(stats[key])}</strong>`);
        return parts.length ? `<div class="stat-scope">${parts.join(' · ')}</div>` : '';
      }
      if (!def.scope || def.amountOnly) return '';
      const ouvrageKey = `${def.key}_ouvrages`;
      if (!has(ouvrageKey)) return '';
      const parts = [`🏗️ <strong>${plural(stats[ouvrageKey], 'ouvrage', 'ouvrages')}</strong>`];
      const pointKey = `${def.key}_points_eau`;
      if (def.scope === 'facture' && has(pointKey)) parts.push(`🚰 ${plural(stats[pointKey], "point d'eau", "points d'eau")}`);
      return `<div class="stat-scope">${parts.join(' · ')}</div>`;
    };
    const renderTiles = defs => {
      const items = visibleDefs(defs);
      if (!items.length) return '';
      return `
      <div class="stat-grid">
        ${items.map(def => `
          <button type="button" class="stat-tile ${def.wide ? 'wide' : ''} ${def.alertIfPositive && stats[def.key] > 0 ? 'alert' : ''}" data-detail="${def.detailType || ''}" data-label="${def.icon} ${statLabel(def)}">
            <div class="stat-value">${def.amountOnly ? formatKAr(stats[def.key]) : (Object.prototype.hasOwnProperty.call(stats, def.key) ? (stats[def.key] || 0).toLocaleString('fr-FR') : '—')}</div>
            <div class="stat-text">
            <div class="stat-label">${def.icon} ${def.short || statLabel(def)}</div>
            ${scopeHtml(def)}
            ${!def.amountOnly && Object.prototype.hasOwnProperty.call(stats, `${def.key}_montant`) ? `<div class="stat-amount">${formatKAr(stats[`${def.key}_montant`])}</div>` : ''}
            </div>
          </button>
        `).join('')}
      </div>
      `;
    };
    const renderSection = (title, defs) => visibleDefs(defs).length
      ? `<section class="stat-section"><div class="stat-section-title">${title}</div>${renderTiles(defs)}</section>`
      : '';
    hydriaContent.innerHTML = `
      <div id="hydriaImportStatus">Dernière importation DiameX : ${lastDiamexImport || 'inconnue'}</div>
      ${renderTiles(GENERAL_STAT_DEFS)}
      <section class="stat-section" id="realisationsSection"></section>
      ${renderSection('Volumétrique', VOLUME_STAT_DEFS)}
      ${renderSection('Forfaitaire', FORFAIT_STAT_DEFS)}
      ${renderSection('Réparations', REPARATIONS_STAT_DEFS)}
      ${renderSection('Réhabilitations', REHABILITATIONS_STAT_DEFS)}
      ${renderSection('Installations', INSTALLATIONS_STAT_DEFS)}
      ${renderSection('Autres activités', AUTRES_ACTIVITES_STAT_DEFS)}
      ${splitStatsAvailable ? '' : '<div id="hydriaStatus">Mise à jour du serveur Hydria requise</div>'}
      <div id="logoutLink">Se déconnecter</div>
    `;
    hydriaContent.querySelectorAll('.stat-tile[data-detail]:not([data-detail=""])').forEach(tile => {
      tile.addEventListener('click', () => openDetail(tile.dataset.detail, tile.dataset.label));
    });
    document.getElementById('logoutLink').addEventListener('click', () => {
      if (hasNativeDrag) window.widgetAPI.clearHydriaToken();
      currentHydriaToken = null;
      renderLoginForm();
    });
  }

  async function loadHydriaStats(token) {
    if (!token) {
      hydriaContent.innerHTML = '<div id="hydriaStatus">Chargement…</div>';
      return;
    }
    currentHydriaToken = token;
    try {
      const params = currentFiltreParams();
      const r = await fetch(`${HYDRIA_BASE_URL}/widget/api/stats/?${params.toString()}`, {
        headers: { 'Authorization': `Token ${token}` }
      });
      if (r.status === 401) {
        if (hasNativeDrag) window.widgetAPI.clearHydriaToken();
        renderLoginForm('Session expirée, reconnecte-toi');
        return;
      }
      const data = await r.json();
      if (data.success) {
        notifyPaymentChanges(data.stats);
        renderHydriaStats(data.stats, data.derniere_importation_diamex_relative);
        loadRealisations(token);
        loadFiltres(token);
      } else {
        hydriaContent.innerHTML = '<div id="hydriaStatus">Données indisponibles</div>';
      }
    } catch (e) {
      hydriaContent.innerHTML = '<div id="hydriaStatus">Hors ligne — données Hydria indisponibles</div>';
    }
  }

  // ---------- Filtres pliables ----------
  const filtresToggle = document.getElementById('filtresToggle');
  const filtresPanel = document.getElementById('filtresPanel');
  const filtresToggleIcon = document.getElementById('filtresToggleIcon');
  const perimetreSummary = document.getElementById('perimetreSummary');
  let filtresLoaded = false;

  filtresToggle.addEventListener('click', () => {
    filtresPanel.classList.toggle('open');
    filtresToggleIcon.textContent = filtresPanel.classList.contains('open') ? '▴' : '▾';
  });

  // Résumé du périmètre choisi, toujours visible même filtres repliés — même
  // formule que TokenStore.Filters.displaySummary() côté widget Android :
  // n'affiche que les filtres non "Tous/Toutes", sinon "Tous les périmètres".
  function updatePerimetreSummary() {
    const selectIds = ['filtreOrganisation', 'filtreEmploye', 'filtreRegion', 'filtreDistrict', 'filtreCommune'];
    const values = selectIds
      .map(id => document.getElementById(id))
      .filter(sel => sel && sel.value && sel.value !== 'all')
      .map(sel => sel.options[sel.selectedIndex]?.textContent || sel.value);
    perimetreSummary.textContent = values.length ? values.join(' · ') : 'Tous les périmètres';
  }

  async function loadFiltres(token) {
    if (filtresLoaded || !token) return;
    try {
      const r = await fetch(`${HYDRIA_BASE_URL}/widget/api/filtres/`, {
        headers: { 'Authorization': `Token ${token}` }
      });
      const data = await r.json();
      if (!data.success) return;
      filtresLoaded = true;

      const orgSelect = document.getElementById('filtreOrganisation');
      orgSelect.innerHTML = data.organisations.map(o =>
        `<option value="${o.id}" ${o.id === data.default_organisation_id ? 'selected' : ''}>${o.nom}</option>`
      ).join('') || '<option value="all">Toutes</option>';

      const employeSelect = document.getElementById('filtreEmploye');
      employeSelect.innerHTML = '<option value="all">Tous les agents de recouvrement</option>' +
        (data.employes || []).map(e => `<option value="${e.id}">${e.nom}${e.poste ? ` · ${e.poste}` : ''}</option>`).join('');

      const regionSelect = document.getElementById('filtreRegion');
      regionSelect.innerHTML = '<option value="all">Toutes les régions</option>' +
        data.regions.map(r => `<option value="${r.id}">${r.nom}</option>`).join('');

      const districtSelect = document.getElementById('filtreDistrict');
      districtSelect.innerHTML = '<option value="all">Tous les districts</option>' +
        data.districts.map(d => `<option value="${d.id}">${d.nom}</option>`).join('');

      const communeSelect = document.getElementById('filtreCommune');
      communeSelect.innerHTML = '<option value="all">Toutes les communes</option>' +
        data.communes.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');

      updatePerimetreSummary();

      [orgSelect, employeSelect, regionSelect, districtSelect, communeSelect].forEach(sel => {
        sel.addEventListener('change', () => {
          loadHydriaStats(currentHydriaToken);
          updatePerimetreSummary();
        });
      });

      regionSelect.addEventListener('change', () => {
        const regionId = regionSelect.value;
        const filtered = regionId === 'all' ? data.districts : data.districts.filter(d => d.region_id === regionId);
        districtSelect.innerHTML = '<option value="all">Tous les districts</option>' +
          filtered.map(d => `<option value="${d.id}">${d.nom}</option>`).join('');
        communeSelect.innerHTML = '<option value="all">Toutes les communes</option>' +
          data.communes.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
        updatePerimetreSummary();
      });

      districtSelect.addEventListener('change', () => {
        const districtId = districtSelect.value;
        const filtered = districtId === 'all' ? data.communes : data.communes.filter(c => c.district_id === districtId);
        communeSelect.innerHTML = '<option value="all">Toutes les communes</option>' +
          filtered.map(c => `<option value="${c.id}">${c.nom}</option>`).join('');
        updatePerimetreSummary();
      });
    } catch (e) {
      console.warn('[Widget] Filtres Hydria indisponibles:', e);
    }
  }

  // ---------- Modal détail ----------
  const detailOverlay = document.getElementById('detailOverlay');
  const detailTitle = document.getElementById('detailTitle');
  const detailBody = document.getElementById('detailBody');
  const escHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  // Indemnités RBF : regroupées Région → District → Commune → Ouvrage (lignes à plat renvoyées par l'API).
  const RBF_TYPES = new Set(['rbf_points_depassement_plafond', 'rbf_points_sans_paiement_effectif']);

  const GROUPABLE_TYPES = new Set([
    'ouvrages', 'points_eau',
    'factures_volumetriques_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_non_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_non_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_mois_courant_non_pointees',
    'factures_volumetriques_mois_passes_non_pointees',
    'factures_forfaitaires_mois_courant_non_pointees',
    'factures_forfaitaires_mois_passes_non_pointees',
    ...RBF_TYPES
  ]);

  // Niveau géographique déjà fixé par le filtre actif du widget (0 = aucun, 1 = région, 2 = district,
  // 3 = commune). Un modal ne propose jamais un regroupement que le filtre a déjà tranché : avec une
  // commune choisie, plus de région / district / commune ; avec un district, plus de région / district.
  function fixedGeoLevel() {
    const chosen = id => { const el = document.getElementById(id); return !!(el && el.value && el.value !== 'all'); };
    if (chosen('filtreCommune')) return 3;
    if (chosen('filtreDistrict')) return 2;
    if (chosen('filtreRegion')) return 1;
    return 0;
  }
  const filtreCommuneId = () => document.getElementById('filtreCommune')?.value || '';
  const filtreCommuneNom = () => {
    const sel = document.getElementById('filtreCommune');
    return sel?.options[sel.selectedIndex]?.textContent || '';
  };

  const GEO_LEVELS = [
    { level: 1, id: 'region_id', name: 'region', icon: '🗺️' },
    { level: 2, id: 'district_id', name: 'district', icon: '📍' },
    { level: 3, id: 'commune_id', name: 'commune', icon: '🏘️' },
    { level: 4, id: 'ouvrage_id', name: 'ouvrage', icon: '🏗️' },
  ];

  // HTML d'un arbre dépliable sur les niveaux donnés ; le dernier niveau est la feuille cliquable
  // (enregistrée dans `leaves`, retrouvée via data-leaf).
  function geoTreeHtml(rows, levels, leaves, path = '') {
    const [lvl, ...rest] = levels;
    const groups = new Map();
    rows.forEach(r => {
      const key = `${path}/${r[lvl.id]}|${r[lvl.name]}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    return [...groups.entries()].map(([key, list]) => {
      const count = list.reduce((n, r) => n + r.count, 0);
      const name = `${lvl.icon} ${escHtml(list[0][lvl.name])}`;
      if (!rest.length) {
        const idx = leaves.push(list[0]) - 1;
        return `<button type="button" class="geo-commune-row" data-leaf="${idx}"><span>${name}</span><span class="geo-count">${count.toLocaleString('fr-FR')}</span></button>`;
      }
      return `
        <div class="geo-district">
          <button type="button" class="geo-district-toggle">
            <span>${name}</span>
            <span class="geo-count">${count.toLocaleString('fr-FR')} <span class="geo-caret">▾</span></span>
          </button>
          <div class="geo-communes">${geoTreeHtml(list, rest, leaves, key)}</div>
        </div>`;
    }).join('');
  }

  function bindGeoTree(leaves, onLeaf) {
    detailBody.querySelectorAll('.geo-district-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.nextElementSibling.classList.toggle('open');
        btn.classList.toggle('open');
      });
    });
    detailBody.querySelectorAll('[data-leaf]').forEach(btn => {
      btn.addEventListener('click', () => onLeaf(leaves[Number(btn.dataset.leaf)]));
    });
  }

  async function openDetail(detailType, label) {
    const cleanLabel = label.replace(/^[^\s]+\s/, '');
    detailTitle.textContent = cleanLabel;
    detailBody.innerHTML = '<div class="detail-empty">Chargement…</div>';
    detailOverlay.classList.add('open');

    if (!currentHydriaToken) {
      detailBody.innerHTML = '<div class="detail-empty">Non connecté</div>';
      return;
    }

    if (GROUPABLE_TYPES.has(detailType)) {
      showGroupeView(detailType, cleanLabel);
    } else {
      showDetailList(detailType, cleanLabel, {});
    }
  }

  async function showGroupeView(detailType, label) {
    detailTitle.textContent = label;
    const fixed = fixedGeoLevel();

    // Commune déjà choisie dans le filtre : plus de région / district / commune à parcourir.
    // (Les ouvrages et les RBF passent par l'API, qui sait sauter ces niveaux.)
    if (fixed >= 3 && detailType !== 'ouvrages' && !RBF_TYPES.has(detailType)) {
      if (OUVRAGE_GROUPED_TYPES.has(detailType)) {
        showOuvrageGroupeView(detailType, label, filtreCommuneId(), filtreCommuneNom(), true);
      } else {
        showDetailList(detailType, label, { commune_id: filtreCommuneId() });
      }
      return;
    }

    detailBody.innerHTML = '<div class="detail-empty">Chargement…</div>';
    try {
      const params = currentFiltreParams();
      const r = await fetch(`${HYDRIA_BASE_URL}/widget/api/groupes/${detailType}/?${params.toString()}`, {
        headers: { 'Authorization': `Token ${currentHydriaToken}` }
      });
      const data = await r.json();
      const empty = !data.success || (data.flat ? data.rows.length === 0 : data.districts.length === 0);
      if (empty) {
        detailBody.innerHTML = '<div class="detail-empty">Aucun élément</div>';
        return;
      }

      // Ouvrages : groupes « modalité » (parfois + district) déjà construits par l'API.
      if (detailType === 'ouvrages') {
        const openOuvrages = (name, communeId) => showDetailList('ouvrages', `${label} — ${name}`, { commune_id: communeId });
        if (fixed >= 3) {
          // Commune fixée : une ligne par modalité, sans niveau district / commune.
          detailBody.innerHTML = `<div class="detail-total">${data.total.toLocaleString('fr-FR')} au total</div>` +
            data.districts.flatMap(d => d.communes.map(c => `
              <button type="button" class="geo-commune-row" data-modalite-commune="${escHtml(c.commune_id)}" data-modalite-nom="${escHtml(d.district)}">
                <span>${escHtml(d.district)}</span><span class="geo-count">${c.count.toLocaleString('fr-FR')}</span>
              </button>`)).join('');
          detailBody.querySelectorAll('[data-modalite-commune]').forEach(btn => {
            btn.addEventListener('click', () => openOuvrages(btn.dataset.modaliteNom, btn.dataset.modaliteCommune));
          });
          return;
        }
        detailBody.innerHTML = `
          <div class="detail-total">${data.total.toLocaleString('fr-FR')} au total</div>
          ${data.districts.map(d => `
            <div class="geo-district">
              <button type="button" class="geo-district-toggle">
                <span>📍 ${escHtml(d.district)}</span>
                <span class="geo-count">${d.total.toLocaleString('fr-FR')} <span class="geo-caret">▾</span></span>
              </button>
              <div class="geo-communes">
                ${d.communes.map(c => `
                  <button type="button" class="geo-commune-row" data-commune-id="${escHtml(c.commune_id)}" data-commune-nom="${escHtml(c.commune)}">
                    <span>${escHtml(c.commune)}</span><span class="geo-count">${c.count.toLocaleString('fr-FR')}</span>
                  </button>`).join('')}
              </div>
            </div>`).join('')}`;
        detailBody.querySelectorAll('.geo-district-toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            btn.nextElementSibling.classList.toggle('open');
            btn.classList.toggle('open');
          });
        });
        detailBody.querySelectorAll('.geo-commune-row').forEach(btn => {
          btn.addEventListener('click', () => openOuvrages(btn.dataset.communeNom, btn.dataset.communeId));
        });
        return;
      }

      // Autres types : arbre Région → District → Commune (→ Ouvrage pour les RBF), niveaux fixés par le filtre retirés.
      const isRbf = RBF_TYPES.has(detailType);
      const rows = data.flat ? data.rows : data.districts.flatMap(d =>
        d.communes.map(c => ({
          region_id: d.region_id || '', region: d.region || 'Sans région',
          district_id: d.district_id || '', district: d.district,
          commune_id: c.commune_id, commune: c.commune, count: c.count,
        })));
      const levels = GEO_LEVELS.filter(l => l.level > fixed && (isRbf || l.name !== 'ouvrage'));
      const leaves = [];
      detailBody.innerHTML = `<div class="detail-total">${data.total.toLocaleString('fr-FR')} au total</div>` +
        geoTreeHtml(rows, levels, leaves);
      bindGeoTree(leaves, leaf => {
        if (isRbf) {
          showDetailList(detailType, `${label} — ${leaf.ouvrage}`, {
            commune_id: leaf.commune_id, ouvrage_id: leaf.ouvrage_id,
          }, () => showGroupeView(detailType, label));
        } else if (OUVRAGE_GROUPED_TYPES.has(detailType)) {
          showOuvrageGroupeView(detailType, label, leaf.commune_id, leaf.commune);
        } else {
          showDetailList(detailType, `${label} — ${leaf.commune}`, { commune_id: leaf.commune_id });
        }
      });
    } catch (e) {
      detailBody.innerHTML = '<div class="detail-empty">Erreur de chargement</div>';
    }
  }

  // Factures : après District → Commune, regroupement par OUVRAGE (factures,
  // points d'eau, montant) puis liste des factures de l'ouvrage.
  const OUVRAGE_GROUPED_TYPES = new Set([
    'factures_volumetriques_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_non_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_mois_courant_non_pointees',
    'factures_volumetriques_mois_passes_non_pointees',
    'factures_forfaitaires_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_non_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_mois_courant_non_pointees',
    'factures_forfaitaires_mois_passes_non_pointees',
  ]);

  // `isRoot` : la commune vient du filtre du widget, c'est donc le premier niveau du modal (pas de retour vers les communes).
  async function showOuvrageGroupeView(detailType, rootLabel, communeId, communeNom, isRoot) {
    if (isRoot) {
      detailTitle.textContent = rootLabel;
    } else {
      detailTitle.innerHTML = `<span class="detail-back" id="detailBack">←</span> ${escHtml(rootLabel)} — ${escHtml(communeNom)}`;
      document.getElementById('detailBack').addEventListener('click', () => showGroupeView(detailType, rootLabel));
    }
    detailBody.innerHTML = '<div class="detail-empty">Chargement…</div>';
    try {
      const params = currentFiltreParams();
      params.set('commune_id', communeId);
      const r = await fetch(`${HYDRIA_BASE_URL}/widget/api/groupes/${detailType}/?${params.toString()}`, {
        headers: { 'Authorization': `Token ${currentHydriaToken}` }
      });
      const data = await r.json();
      if (!data.success || !data.ouvrages || data.ouvrages.length === 0) {
        detailBody.innerHTML = '<div class="detail-empty">Aucun élément</div>';
        return;
      }
      const kAr = value => `${(Number(value || 0) / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} K Ar`;
      const esc = escHtml;
      detailBody.innerHTML = `
        <div class="detail-total">${data.ouvrages.length.toLocaleString('fr-FR')} ouvrage${data.ouvrages.length > 1 ? 's' : ''} · ${data.total.toLocaleString('fr-FR')} facture${data.total > 1 ? 's' : ''}</div>
        ${data.ouvrages.map((o, oi) => `
          <button type="button" class="geo-commune-row" data-ouvrage-idx="${oi}" ${o.ouvrage_id ? '' : 'disabled'}>
            <span>🏗️ ${esc(o.ouvrage)}<br><small style="opacity:.7">${o.points_eau.toLocaleString('fr-FR')} point${o.points_eau > 1 ? 's' : ''} d'eau · ${kAr(o.montant)}</small></span>
            <span class="geo-count">${o.count.toLocaleString('fr-FR')}</span>
          </button>
        `).join('')}
      `;
      detailBody.querySelectorAll('[data-ouvrage-idx]').forEach(btn => {
        const o = data.ouvrages[Number(btn.dataset.ouvrageIdx)];
        btn.addEventListener('click', () => {
          showDetailList(detailType, `${rootLabel} — ${communeNom ? communeNom + ' — ' : ''}${o.ouvrage}`, {
            commune_id: communeId,
            ouvrage_id: o.ouvrage_id,
          }, () => showOuvrageGroupeView(detailType, rootLabel, communeId, communeNom, isRoot));
        });
      });
    } catch (e) {
      detailBody.innerHTML = '<div class="detail-empty">Erreur de chargement</div>';
    }
  }

  // Types de détail dont chaque ligne représente une facture d'un point d'eau
  // rattaché à un ouvrage précis, pour lequel on peut ouvrir directement le
  // modal de pointage correspondant sur hydria.mg (au lieu de forcer le
  // parcours manuel : taper l'adresse, chercher l'ouvrage, ouvrir le modal).
  const VOLUME_FACTURE_TYPES = new Set([
    'factures_volumetriques_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_non_mises_a_jour_mois_courant_non_pointees',
    'factures_volumetriques_mois_courant_non_pointees',
    'factures_volumetriques_mois_passes_non_pointees',
  ]);
  const FORFAIT_FACTURE_TYPES = new Set([
    'factures_forfaitaires_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_non_mises_a_jour_mois_courant_non_pointees',
    'factures_forfaitaires_mois_courant_non_pointees',
    'factures_forfaitaires_mois_passes_non_pointees',
    'factures_forfaitaires_jour',
  ]);

  // Construit l'URL du dashboard Hydria correspondant, pré-filtrée sur
  // l'ouvrage (et le mois pour le volumétrique) pour ouvrir directement le
  // bon modal de pointage au chargement de la page (cf. scripts ajoutés dans
  // dashboard_paiements_volume.html / dashboard_paiements_forfaitaire.html).
  // Les lignes RBF portent leur propre lien (`href`) : la page qui explique
  // pourquoi le point d'eau figure dans le compteur.
  function hydriaFactureLink(detailType, row) {
    if (!row) return null;
    if (row.href) return `${HYDRIA_BASE_URL}${row.href}`;
    if (!row.ouvrage_id) return null;
    if (VOLUME_FACTURE_TYPES.has(detailType)) {
      if (!row.mois) return null;
      const params = new URLSearchParams({ ouvrage: row.ouvrage_id, open_mois: row.mois });
      if (row.annee) params.set('annee', row.annee);
      if (row.ouvrage_nom) params.set('open_ouvrage_nom', row.ouvrage_nom);
      return `${HYDRIA_BASE_URL}/comptabilite/dashboard-paiements-volume/?${params.toString()}`;
    }
    if (FORFAIT_FACTURE_TYPES.has(detailType)) {
      const params = new URLSearchParams({ ouvrage: row.ouvrage_id, open_details: '1' });
      if (row.annee) params.set('annee', row.annee);
      return `${HYDRIA_BASE_URL}/comptabilite/dashboard-paiements-forfaitaire/?${params.toString()}`;
    }
    return null;
  }

  // Page Hydria « liste complète » : même périmètre (filtres du widget + commune / ouvrage du modal).
  function hydriaListeLink(detailType, label, extraParams) {
    const params = currentFiltreParams();
    Object.entries(extraParams || {}).forEach(([k, v]) => params.set(k, v));
    params.set('titre', label);
    return `${HYDRIA_BASE_URL}/widget/liste/${detailType}/?${params.toString()}`;
  }

  async function showDetailList(detailType, label, extraParams, backAction) {
    detailTitle.innerHTML = `<span class="detail-back" id="detailBack">←</span> ${escHtml(label)}`;
    detailBody.innerHTML = '<div class="detail-empty">Chargement…</div>';

    const backBtn = document.getElementById('detailBack');
    if (backBtn) {
      if (backAction) {
        backBtn.style.display = 'inline';
        backBtn.addEventListener('click', backAction);
      } else if (GROUPABLE_TYPES.has(detailType) && extraParams.commune_id && fixedGeoLevel() < 3) {
        backBtn.style.display = 'inline';
        backBtn.addEventListener('click', () => showGroupeView(detailType, label.split(' — ')[0]));
      } else {
        backBtn.style.display = 'none';
      }
    }

    try {
      const params = currentFiltreParams();
      Object.entries(extraParams || {}).forEach(([k, v]) => params.set(k, v));
      const r = await fetch(`${HYDRIA_BASE_URL}/widget/api/details/${detailType}/?${params.toString()}`, {
        headers: { 'Authorization': `Token ${currentHydriaToken}` }
      });
      const data = await r.json();
      if (!data.success || data.rows.length === 0) {
        detailBody.innerHTML = '<div class="detail-empty">Aucun élément</div>';
        return;
      }
      let lastGroup = null;
      detailBody.innerHTML = data.rows.map((row, idx) => {
        const link = hydriaFactureLink(detailType, row);
        let groupHeader = '';
        if (row.group && row.group !== lastGroup) {
          lastGroup = row.group;
          const n = data.rows.filter(r => r.group === row.group).length;
          groupHeader = `<div class="detail-group-header">${row.group} <span>(${n})</span></div>`;
        }
        const idxls = row.idxls ? `<span class="row-idxls">${escHtml(row.idxls)}</span>` : '';
        const tip = row.href ? 'Pourquoi ce point est compté (Hydria)' : 'Ouvrir sur Hydria';
        return groupHeader + `
        <div class="detail-row${link ? ' row-clickable' : ''}" ${link ? `data-row-idx="${idx}" title="${tip}"` : ''}>
          <div>
            <div class="row-label">${idxls}${row.label}</div>
            ${row.sub ? `<div class="row-sub">${row.sub}</div>` : ''}
          </div>
          ${link ? '<span class="row-link-icon">↗</span>' : ''}
        </div>
      `;
      }).join('') + (
        data.total > data.shown
          ? `<div class="detail-footer">${data.shown} sur ${data.total.toLocaleString('fr-FR')} — <a href="#" class="detail-link" id="detailListeLink">voir la liste complète sur Hydria ↗</a></div>`
          : ''
      );
      const listeLink = document.getElementById('detailListeLink');
      if (listeLink) {
        listeLink.addEventListener('click', (e) => {
          e.preventDefault();
          if (hasNativeDrag) window.widgetAPI.openExternal(hydriaListeLink(detailType, label, extraParams));
        });
      }
      detailBody.querySelectorAll('.detail-row.row-clickable').forEach(el => {
        const row = data.rows[Number(el.dataset.rowIdx)];
        const link = hydriaFactureLink(detailType, row);
        if (!link) return;
        el.addEventListener('click', () => {
          if (hasNativeDrag) window.widgetAPI.openExternal(link);
        });
      });
    } catch (e) {
      detailBody.innerHTML = '<div class="detail-empty">Erreur de chargement</div>';
    }
  }

  document.getElementById('detailClose').addEventListener('click', () => {
    detailOverlay.classList.remove('open');
  });
  detailOverlay.addEventListener('click', (e) => {
    if (e.target === detailOverlay) detailOverlay.classList.remove('open');
  });

  async function initHydria() {
    if (!hasNativeDrag) {
      hydriaContent.innerHTML = '<div id="hydriaStatus">Disponible uniquement dans l\'appli desktop</div>';
      return;
    }
    const token = await window.widgetAPI.getHydriaToken();
    if (token) {
      loadHydriaStats(token);
    } else {
      renderLoginForm();
    }
  }

  initHydria();
  setInterval(async () => {
    if (!hasNativeDrag) return;
    const token = await window.widgetAPI.getHydriaToken();
    if (token) loadHydriaStats(token);
  }, 5 * 60 * 1000);
})();
</script>

</body>
</html>
