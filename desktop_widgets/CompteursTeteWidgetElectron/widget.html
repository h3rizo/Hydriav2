<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydria · Compteurs de tête</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #72c7b3;
      --accent-soft: rgba(114, 199, 179, .18);
      --danger: #ffbd72;
      --surface: rgba(12, 28, 39, .76);
      --surface-2: rgba(255, 255, 255, .07);
      --line: rgba(255, 255, 255, .15);
      --text: #f4fbff;
      --muted: rgba(228, 241, 248, .68);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(94, 176, 188, .22), transparent 42%),
        linear-gradient(150deg, rgba(18, 43, 57, .94), rgba(7, 20, 29, .96));
    }
    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { height: 100%; display: flex; flex-direction: column; position: relative; }
    .shell::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18;
      background-image: radial-gradient(rgba(255,255,255,.35) .45px, transparent .45px);
      background-size: 7px 7px;
    }
    header {
      position: relative; z-index: 2; flex: 0 0 auto; padding: 17px 16px 13px;
      border-bottom: 1px solid var(--line); -webkit-app-region: drag;
    }
    .eyebrow { font-size: 9px; letter-spacing: .17em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    h1 { margin: 5px 78px 0 0; font-size: 20px; line-height: 1.08; letter-spacing: -.035em; text-wrap: balance; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 11px; }
    .controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; -webkit-app-region: no-drag; }
    .icon-button {
      width: 27px; height: 27px; border: 1px solid var(--line); border-radius: 8px;
      color: var(--text); background: rgba(255,255,255,.07); cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    .icon-button:hover { background: rgba(255,255,255,.15); transform: translateY(-1px); }
    .icon-button:active { transform: translateY(1px) scale(.97); }
    .icon-button.active { background: var(--accent-soft); border-color: rgba(114,199,179,.55); }
    main { position: relative; z-index: 1; min-height: 0; flex: 1; overflow-y: auto; padding: 12px 14px 18px; scrollbar-width: thin; }
    .toolbar { display: flex; gap: 7px; margin-bottom: 11px; }
    .toolbar-button {
      flex: 1; padding: 8px 10px; color: var(--text); background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 11px;
      transition: background .18s ease;
    }
    .toolbar-button:hover { background: rgba(255,255,255,.13); }
    .filters { display: none; gap: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(0,0,0,.12); }
    .filters.open { display: grid; grid-template-columns: 1fr 1fr; }
    .field:first-child { grid-column: 1 / -1; }
    label { display: block; margin: 0 0 4px 2px; color: var(--muted); font-size: 9px; letter-spacing: .04em; }
    select, input {
      width: 100%; min-width: 0; padding: 7px 8px; color: var(--text); background: rgba(255,255,255,.08);
      border: 1px solid var(--line); border-radius: 8px; font-size: 11px;
    }
    option { color: #10202b; background: #eef5f7; }
    .summary { display: flex; align-items: end; justify-content: space-between; margin: 4px 2px 10px; }
    .total { font-size: 34px; line-height: 1; font-weight: 650; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
    .total-label { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .updated { color: var(--muted); font-size: 9px; text-align: right; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      min-height: 82px; padding: 11px; color: var(--text); text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 13px;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .stat:hover { transform: translateY(-2px); background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.27); }
    .stat:active { transform: translateY(0) scale(.98); }
    .stat.alert .value { color: var(--danger); }
    .value { font-size: 25px; line-height: 1; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .label { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .mark { color: var(--accent); margin-right: 3px; }
    .state { padding: 42px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .skeletons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .skeleton { height: 82px; border-radius: 13px; background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.12), rgba(255,255,255,.05)); background-size: 200% 100%; animation: shimmer 1.35s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .login { display: grid; gap: 9px; padding: 12px 2px; }
    .login p { margin: 0 0 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .primary { padding: 9px 12px; border: 0; border-radius: 9px; color: #09201d; background: var(--accent); font-weight: 700; cursor: pointer; }
    .error { min-height: 14px; color: #ffc4b6; font-size: 10px; }
    .detail { display: none; position: absolute; inset: 0; z-index: 8; flex-direction: column; background: rgba(8,21,30,.98); backdrop-filter: blur(18px); }
    .detail.open { display: flex; }
    .detail-head { display: flex; align-items: center; gap: 9px; padding: 14px; border-bottom: 1px solid var(--line); -webkit-app-region: no-drag; }
    .detail-head button { flex: 0 0 auto; }
    .detail-head .back-button { width: auto; min-width: 86px; min-height: 44px; padding: 0 11px; font-size: 11px; -webkit-app-region: no-drag; }
    .detail-title { min-width: 0; flex: 1; font-size: 13px; font-weight: 650; }
    .detail-body { min-height: 0; flex: 1; overflow-y: auto; padding: 8px 14px 14px; }
    .row { padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.09); }
    .row-label { font-size: 11px; font-weight: 600; }
    .row-sub { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .row.clickable { cursor: pointer; transition: background .18s ease, transform .18s ease; }
    .row.clickable:hover { background: rgba(255,255,255,.07); transform: translateX(2px); }
    .history-chart { margin-top: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.045); }
    .history-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .history-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
    .history-summary div { padding: 9px; border-radius: 10px; background: var(--surface-2); }
    .history-summary strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .history-summary span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .detail-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .text-button { padding: 0; border: 0; color: var(--accent); background: transparent; cursor: pointer; font-weight: 650; }
    .logout { margin-top: 13px; width: 100%; color: var(--muted); background: transparent; border: 0; font-size: 9px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="eyebrow">Hydria · suivi opérationnel</div>
      <h1 id="appTitle">Indicateurs</h1>
      <div class="subtitle" id="appSubtitle"></div>
      <div class="controls">
        <button class="icon-button active" id="pinButton" title="Toujours au premier plan">◆</button>
        <button class="icon-button" id="refreshButton" title="Actualiser">↻</button>
        <button class="icon-button" id="closeButton" title="Fermer">×</button>
      </div>
    </header>
    <main>
      <div class="toolbar">
        <button class="toolbar-button" id="filtersButton">Filtres géographiques</button>
      </div>
      <section class="filters" id="filtersPanel">
        <div class="field"><label for="organisation">Organisation</label><select id="organisation"><option value="all">Toutes</option></select></div>
        <div class="field"><label for="region">Région</label><select id="region"><option value="all">Toutes</option></select></div>
        <div class="field"><label for="district">District</label><select id="district"><option value="all">Tous</option></select></div>
        <div class="field"><label for="commune">Commune</label><select id="commune"><option value="all">Toutes</option></select></div>
      </section>
      <section id="content"><div class="state">Connexion à Hydria…</div></section>
    </main>
    <section class="detail" id="detailPanel">
      <div class="detail-head"><button type="button" class="icon-button back-button" id="detailBack" aria-label="Retour au widget">← Retour</button><div class="detail-title" id="detailTitle">Détail</div></div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-footer"><span id="detailCount"></span><button class="text-button" id="openFullPage">Ouvrir dans Hydria</button></div>
    </section>
  </div>
  <script>
    (() => {
      const BASE_URL = 'https://www.hydria.mg';
      const kind = new URLSearchParams(location.search).get('kind') === 'flows' ? 'flows' : 'meters';
      const CONFIG = kind === 'meters' ? {
        title: 'Compteurs de tête',
        subtitle: 'Écarts entre volume distribué et volume relevé',
        endpoint: '/widget/api/compteurs-tete/',
        totalLabel: 'compteurs suivis',
        definitions: [
          { key: 'good', mark: '✓', label: 'Réseau bon · < 5 %' },
          { key: 'acceptable', mark: '≈', label: 'Écart tolérable · 5–10 %' },
          { key: 'investigate', mark: '!', label: 'À investiguer · 10–20 %', alert: true },
          { key: 'critical', mark: '▲', label: 'Anormaux · > 20 %', alert: true },
          { key: 'non_mesure', mark: '—', label: 'Sans relevé exploitable' },
          { key: 'hors_service', mark: '×', label: 'Compteurs hors service', status: 'hors_service', alert: true },
        ],
      } : {
        title: 'Débits de source',
        subtitle: 'Évolution des débits mesurés par ouvrage',
        endpoint: '/widget/api/debits-source/',
        totalLabel: 'ouvrages suivis',
        definitions: [
          { key: 'critique', mark: '▲', label: 'Évolution critique', alert: true },
          { key: 'baisse', mark: '↘', label: 'En baisse', alert: true },
          { key: 'stable', mark: '→', label: 'Stable' },
          { key: 'non_mesure', mark: '—', label: 'Non mesuré' },
          { key: 'hausse', mark: '↗', label: 'En hausse' },
          { key: 'surveille', mark: '◉', label: 'À surveiller', alert: true },
          { key: 'normal', mark: '✓', label: 'Normal' },
          { key: 'inconnu', mark: '?', label: 'Évolution inconnue' },
        ],
      };

      const content = document.getElementById('content');
      const filtersPanel = document.getElementById('filtersPanel');
      const detailPanel = document.getElementById('detailPanel');
      const detailBody = document.getElementById('detailBody');
      let token = null;
      let filtersData = null;
      let fullPageUrl = '';
      let detailBackAction = () => closeDetail();

      document.title = CONFIG.title;
      document.getElementById('appTitle').textContent = CONFIG.title;
      document.getElementById('appSubtitle').textContent = CONFIG.subtitle;
      document.getElementById('closeButton').onclick = () => window.widgetAPI.close();
      document.getElementById('refreshButton').onclick = () => loadStats();
      document.getElementById('pinButton').onclick = () => window.widgetAPI.togglePin();
      document.getElementById('filtersButton').onclick = () => filtersPanel.classList.toggle('open');
      document.getElementById('detailBack').onclick = event => { event.preventDefault(); event.stopPropagation(); detailBackAction(); };
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && detailPanel.classList.contains('open')) detailBackAction(); });
      document.addEventListener('mouseup', event => { if (event.button === 3 && detailPanel.classList.contains('open')) detailBackAction(); });
      document.getElementById('openFullPage').onclick = () => fullPageUrl && window.widgetAPI.openExternal(fullPageUrl);
      window.widgetAPI.onForceRefresh(() => loadStats());
      window.widgetAPI.onPinState(enabled => document.getElementById('pinButton').classList.toggle('active', enabled));

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }

      function closeDetail() {
        detailPanel.classList.remove('open');
        detailBody.innerHTML = '';
        detailBackAction = () => closeDetail();
      }

      function authOptions() { return { headers: { Authorization: `Token ${token}` } }; }

      function currentParams() {
        const params = new URLSearchParams();
        for (const id of ['organisation', 'region', 'district', 'commune']) {
          const value = document.getElementById(id).value;
          if (value && value !== 'all') params.set(`${id}_id`, value);
        }
        if (params.has('organisation_id')) {
          params.set('organisation', params.get('organisation_id'));
          params.delete('organisation_id');
        }
        return params;
      }

      function showLoading() {
        content.innerHTML = '<div class="skeletons">' + '<div class="skeleton"></div>'.repeat(6) + '</div>';
      }

      function showLogin(message = '') {
        content.innerHTML = `
          <form class="login" id="loginForm">
            <p>Connectez ce widget à votre compte Hydria. Le jeton du widget météo est réutilisé automatiquement s’il existe.</p>
            <input id="username" autocomplete="username" placeholder="Nom d’utilisateur" required>
            <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
            <div class="error">${escapeHtml(message)}</div>
            <button class="primary" type="submit">Se connecter</button>
          </form>`;
        document.getElementById('loginForm').onsubmit = async event => {
          event.preventDefault();
          const button = event.currentTarget.querySelector('button');
          button.disabled = true;
          button.textContent = 'Connexion…';
          try {
            const body = new URLSearchParams({
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value,
              device_label: CONFIG.title,
            });
            const response = await fetch(`${BASE_URL}/widget/api/login/`, { method: 'POST', body });
            const data = await response.json();
            if (!data.success) return showLogin(data.error || 'Identifiants invalides');
            token = data.token;
            window.widgetAPI.saveHydriaToken(token);
            await Promise.all([loadFilters(), loadStats()]);
          } catch (_) { showLogin('Connexion réseau impossible'); }
        };
      }

      function renderStats(data) {
        const stats = data.stats || {};
        content.innerHTML = `
          <div class="summary">
            <div><div class="total">${(stats.total || 0).toLocaleString('fr-FR')}</div><div class="total-label">${CONFIG.totalLabel}</div></div>
            <div class="updated">Actualisé<br>${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div>
          </div>
          <div class="stats">
            ${CONFIG.definitions.map(def => `
              <button class="stat ${def.alert && stats[def.key] > 0 ? 'alert' : ''}" data-key="${def.key}">
                <div class="value">${Object.prototype.hasOwnProperty.call(stats, def.key) ? (stats[def.key] || 0).toLocaleString('fr-FR') : '—'}</div>
                <div class="label"><span class="mark">${def.mark}</span> ${def.label}</div>
              </button>`).join('')}
          </div>
          <button class="logout" id="logoutButton">Déconnecter ce widget</button>`;
        content.querySelectorAll('.stat').forEach(button => {
          button.onclick = () => loadDetails(CONFIG.definitions.find(def => def.key === button.dataset.key));
        });
        document.getElementById('logoutButton').onclick = () => {
          token = null;
          window.widgetAPI.clearHydriaToken();
          showLogin();
        };
      }

      async function loadStats() {
        if (!token) return showLogin();
        showLoading();
        try {
          const response = await fetch(`${BASE_URL}${CONFIG.endpoint}?${currentParams()}`, authOptions());
          if (response.status === 401 || response.status === 403) {
            window.widgetAPI.clearHydriaToken(); token = null; return showLogin('Session expirée');
          }
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Données indisponibles');
          renderStats(data);
        } catch (error) {
          content.innerHTML = `<div class="state">${escapeHtml(error.message || 'Serveur Hydria indisponible')}<br>Vérifiez que les nouvelles API ont été déployées.</div>`;
        }
      }

      async function loadDetails(definition) {
        detailBackAction = () => closeDetail();
        detailPanel.classList.add('open');
        document.getElementById('detailTitle').textContent = definition.label;
        detailBody.innerHTML = '<div class="state">Chargement…</div>';
        document.getElementById('detailCount').textContent = '';
        try {
          const params = currentParams();
          if (definition.status !== '') params.set('status', definition.status || definition.key);
          const response = await fetch(`${BASE_URL}${CONFIG.endpoint}?${params}`, authOptions());
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Données indisponibles');
          fullPageUrl = new URL(data.full_url, BASE_URL).href;
          detailBody.innerHTML = data.rows.length ? data.rows.map(row => `
            <article class="row ${kind === 'flows' && row.id ? 'clickable' : ''}" ${kind === 'flows' && row.id ? `data-ouvrage-id="${escapeHtml(row.id)}"` : ''}><div class="row-label">${escapeHtml(row.label)}${kind === 'flows' && row.id ? '  ›' : ''}</div>${row.sub ? `<div class="row-sub">${escapeHtml(row.sub)}</div>` : ''}</article>
          `).join('') : '<div class="state">Aucun élément dans cette catégorie.</div>';
          if (kind === 'flows') detailBody.querySelectorAll('[data-ouvrage-id]').forEach(row => {
            row.onclick = () => loadDebitOuvrage(row.dataset.ouvrageId, definition);
          });
          document.getElementById('detailCount').textContent = `${data.shown} sur ${data.total.toLocaleString('fr-FR')}`;
        } catch (error) {
          detailBody.innerHTML = `<div class="state">${escapeHtml(error.message || 'Chargement impossible')}</div>`;
        }
      }

      function historySvg(history, threshold) {
        if (!history.length) return '<div class="state">Aucun historique de débit.</div>';
        const width = 300, height = 150, left = 28, right = 8, top = 20, bottom = 28;
        const values = history.map(item => Number(item.debit || 0));
        const maximum = Math.max(...values, Number(threshold || 0), 1);
        const step = history.length > 1 ? (width - left - right) / (history.length - 1) : 0;
        const coords = values.map((value, index) => ({ x: left + step * index, y: height - bottom - value / maximum * (height - top - bottom), value }));
        const thresholdY = threshold == null ? null : height - bottom - Number(threshold) / maximum * (height - top - bottom);
        return `<div class="history-chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Historique des débits">
          ${[0,.5,1].map(ratio => `<line x1="${left}" y1="${top + ratio * (height-top-bottom)}" x2="${width-right}" y2="${top + ratio * (height-top-bottom)}" stroke="rgba(255,255,255,.12)" />`).join('')}
          ${thresholdY == null ? '' : `<line x1="${left}" y1="${thresholdY}" x2="${width-right}" y2="${thresholdY}" stroke="#ffbd72" stroke-dasharray="4 3"/><text x="${left+2}" y="${thresholdY-4}" fill="#ffcf98" font-size="7">Seuil ${Number(threshold).toFixed(3)} L/s</text>`}
          <polyline points="${coords.map(point => `${point.x},${point.y}`).join(' ')}" fill="none" stroke="#72c7b3" stroke-width="2" vector-effect="non-scaling-stroke" />
          ${coords.map((point,index) => `<circle cx="${point.x}" cy="${point.y}" r="2.5" fill="#72c7b3"/><text x="${point.x}" y="${Math.max(8,point.y-6)}" text-anchor="middle" fill="#f4fbff" font-size="7">${point.value.toFixed(2)}</text><text x="${point.x}" y="${height-8}" text-anchor="middle" fill="rgba(228,241,248,.68)" font-size="6">${escapeHtml(String(history[index].date || '').slice(5))}</text>`).join('')}
        </svg></div>`;
      }

      async function loadDebitOuvrage(ouvrageId, definition) {
        detailBackAction = () => loadDetails(definition);
        document.getElementById('detailTitle').textContent = 'Historique du débit';
        detailBody.innerHTML = '<div class="state">Chargement de l’historique…</div>';
        try {
          const response = await fetch(`${BASE_URL}/widget/api/ouvrages/${encodeURIComponent(ouvrageId)}/?${currentParams()}`, authOptions());
          const data = await response.json();
          if (!data.success || !data.ouvrage) throw new Error(data.error || 'Détail indisponible');
          const source = data.ouvrage.debit_source;
          fullPageUrl = `${BASE_URL}/plannings/debits-source/?ouvrage=${encodeURIComponent(ouvrageId)}`;
          if (!source) { detailBody.innerHTML = '<div class="state">Aucune mesure de débit enregistrée.</div>'; return; }
          const gap = source.ecart_seuil == null ? '—' : `${Number(source.ecart_seuil) >= 0 ? '+' : ''}${Number(source.ecart_seuil).toFixed(3)} L/s`;
          detailBody.innerHTML = `<div class="history-summary"><div><strong>${Number(source.dernier_debit).toFixed(3)} L/s</strong><span>Dernière mesure</span></div><div><strong>${source.seuil_minimum == null ? '—' : `${Number(source.seuil_minimum).toFixed(3)} L/s`}</strong><span>Seuil minimum</span></div><div><strong>${gap}</strong><span>Écart au seuil</span></div><div><strong>${escapeHtml(source.comparaison)}</strong><span>Position actuelle</span></div></div>${historySvg(source.historique || [], source.seuil_minimum)}`;
          document.getElementById('detailCount').textContent = `${(source.historique || []).length} mesure(s)`;
        } catch (error) { detailBody.innerHTML = `<div class="state">${escapeHtml(error.message || 'Chargement impossible')}</div>`; }
      }

      function setOptions(select, rows, allLabel) {
        select.innerHTML = `<option value="all">${allLabel}</option>` + rows.map(row => `<option value="${escapeHtml(row.id)}">${escapeHtml(row.nom)}</option>`).join('');
      }

      async function loadFilters() {
        if (!token || filtersData) return;
        try {
          const response = await fetch(`${BASE_URL}/widget/api/filtres/`, authOptions());
          const data = await response.json();
          if (!data.success) return;
          filtersData = data;
          setOptions(document.getElementById('organisation'), data.organisations || [], 'Toutes');
          setOptions(document.getElementById('region'), data.regions || [], 'Toutes');
          setOptions(document.getElementById('district'), data.districts || [], 'Tous');
          setOptions(document.getElementById('commune'), data.communes || [], 'Toutes');
          if (data.default_organisation_id) document.getElementById('organisation').value = data.default_organisation_id;
          document.getElementById('region').onchange = () => {
            const id = document.getElementById('region').value;
            setOptions(document.getElementById('district'), id === 'all' ? data.districts : data.districts.filter(row => row.region_id === id), 'Tous');
            setOptions(document.getElementById('commune'), data.communes, 'Toutes');
            loadStats();
          };
          document.getElementById('district').onchange = () => {
            const id = document.getElementById('district').value;
            setOptions(document.getElementById('commune'), id === 'all' ? data.communes : data.communes.filter(row => row.district_id === id), 'Toutes');
            loadStats();
          };
          for (const id of ['organisation', 'commune']) document.getElementById(id).onchange = () => loadStats();
        } catch (_) { /* Les statistiques restent utilisables sans filtres. */ }
      }

      async function init() {
        token = await window.widgetAPI.getHydriaToken();
        if (!token) return showLogin();
        await Promise.all([loadFilters(), loadStats()]);
      }

      init();
      setInterval(() => token && loadStats(), 10 * 60 * 1000);
    })();
  </script>
</body>
</html>
