<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hydria — Actions rapides</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none;
  }

  #main-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(58,123,213,0.92), rgba(44,90,160,0.96));
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: grab;
    color: #fff;
    position: relative;
    transition: transform 0.15s ease;
  }
  #main-btn:active { cursor: grabbing; }
  #main-btn.open { transform: rotate(45deg); }

  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  #wrap.align-left { justify-content: flex-start; }

  #actions-panel {
    display: none;
    position: absolute;
    bottom: 74px;
    right: 0;
    flex-direction: column-reverse;
    gap: 8px;
    align-items: flex-end;
  }
  #actions-panel.open { display: flex; }
  #wrap.align-left #actions-panel {
    left: 0;
    right: auto;
    align-items: flex-start;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(30,40,55,0.85);
    border: 1px solid rgba(255,255,255,0.25);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 24px;
    padding: 6px 8px 6px 14px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    white-space: nowrap;
    opacity: 0;
    transform: translateX(10px);
    transition: opacity 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  #actions-panel.open .action-btn {
    opacity: 1;
    transform: translateX(0);
  }
  #wrap.align-left .action-btn {
    flex-direction: row-reverse;
    padding: 6px 14px 6px 8px;
    transform: translateX(-10px);
  }
  #wrap.align-left #actions-panel.open .action-btn { transform: translateX(0); }
  .action-btn:hover { background: rgba(50,65,85,0.92); }
  .action-btn .label { font-size: 12px; font-weight: 600; }
  .action-btn .icon-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="wrap" class="align-left">
  <div id="actions-panel"></div>
  <div id="main-btn">💬</div>
</div>

<script>
(function () {
  const mainBtn = document.getElementById('main-btn');
  const panel = document.getElementById('actions-panel');
  const wrap = document.getElementById('wrap');
  let alignment = 'left';
  let isOpen = false;
  let dragging = false;
  let moved = false;
  let lastX = 0, lastY = 0;

  mainBtn.addEventListener('mousedown', (e) => {
    dragging = true;
    moved = false;
    lastX = e.screenX;
    lastY = e.screenY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX;
    const dy = e.screenY - lastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    lastX = e.screenX;
    lastY = e.screenY;
    if (window.quickActionsAPI) window.quickActionsAPI.drag(dx, dy);
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
  });

  function notifyWindowSize(open) {
    if (!window.quickActionsAPI) return;
    // Mesurer APRES que le CSS .open ait ete applique et le layout
    // recalcule, sinon on capte l'ancienne taille (panneau ferme).
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const rect = panel.getBoundingClientRect();
        window.quickActionsAPI.toggle(open, rect.width, rect.height, alignment);
      });
    });
  }

  mainBtn.addEventListener('click', async () => {
    if (moved) { moved = false; return; } // c'était un drag, pas un clic
    isOpen = !isOpen;
    if (isOpen && window.quickActionsAPI) {
      alignment = await window.quickActionsAPI.getAlignment();
      wrap.classList.toggle('align-left', alignment === 'left');
    }
    mainBtn.classList.toggle('open', isOpen);
    panel.classList.toggle('open', isOpen);
    notifyWindowSize(isOpen);
  });

  async function init() {
    if (!window.quickActionsAPI) return;
    const actions = await window.quickActionsAPI.getActions();
    panel.innerHTML = actions.map(a => `
      <div class="action-btn" data-action="${a.id}">
        <span class="label">${a.label}</span>
        <span class="icon-circle" style="background:${a.color};">${a.icon}</span>
      </div>
    `).join('');

    panel.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        window.quickActionsAPI.triggerAction(btn.dataset.action);
        isOpen = false;
        mainBtn.classList.remove('open');
        panel.classList.remove('open');
        notifyWindowSize(false);
      });
    });
  }

  init();
})();
</script>

</body>
</html>
