 <tr id="org-{{ org.id }}">
     <form hx-put="{% url 'organizations:update' org.id %}" hx-target="closest tr" hx-swap="outerHTML">
         <td>{{ form.name }}</td>
         <td>{{ form.address }}</td>
         <td>{{ form.is_active }}</td>
         <td>
             <button type="submit" class="btn btn-sm btn-success">Enregistrer</button>
             <button 
                 hx-get="{% url 'organizations:detail' org.id %}"
                 hx-target="closest tr"
                 hx-swap="outerHTML"
                 type="button" 
                 class="btn btn-sm btn-ghost">
                 Annuler
             </button>
         </td>
     </form>
 </tr>
