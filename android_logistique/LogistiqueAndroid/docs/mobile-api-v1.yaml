openapi: 3.1.0
info:
  title: API mobile Logistique Hydria
  version: 1.0.0-partial
servers:
  - url: https://www.hydria.mg/api/mobile/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Première authentification en ligne
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_id]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                device_id: { type: string, format: uuid }
      responses:
        '200':
          description: Jetons courts ; le mot de passe n'est jamais conservé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
  /bootstrap:
    get:
      summary: Référentiels et état initial filtrés par droits
      responses:
        '200':
          description: État initial et curseur
          content:
            application/json:
              schema:
                type: object
                required: [cursor, server_time, payload]
                properties:
                  cursor: { type: string }
                  server_time: { type: string, format: date-time }
                  payload: { type: object, additionalProperties: true }
  /changes:
    get:
      summary: Changements canoniques depuis un curseur
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Page de changements
  /operations:batch:
    post:
      deprecated: true
      summary: Applique atomiquement des opérations idempotentes
      description: Contrat cible documenté mais endpoint non implémenté. Le client ne l'expose pas tant que la parité des formulaires et transitions Django n'est pas garantie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items: { $ref: '#/components/schemas/Operation' }
      responses:
        '200':
          description: Résultat canonique de chaque opération
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor: { type: [string, 'null'] }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/OperationResult' }
  /documents/{document_id}:
    get:
      summary: Télécharge le PDF officiel serveur
      parameters:
        - in: path
          name: document_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF officiel
          content:
            application/pdf: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    DecimalQuantity:
      type: string
      pattern: '^-?[0-9]+\\.[0-9]{2}$'
      examples: ['12.50']
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, minimum: 1 }
    Operation:
      type: object
      required: [clientOperationId, operationType, localEntityId, userId, deviceId, businessDateIso, createdAtIso, payloadJson]
      properties:
        clientOperationId: { type: string, format: uuid }
        operationType:
          type: string
          enum: [CREATE_PURCHASE, RECEIVE_PURCHASE, CREATE_DELIVERY, DELIVER_PENDING, CREATE_TRANSFER, SEND_TRANSFER, RECEIVE_TRANSFER, CANCEL_TRANSFER, CREATE_INVENTORY, ADJUST_STOCK, CREATE_FIELD_RETURN]
        localEntityId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        businessDateIso: { type: string, format: date-time }
        createdAtIso: { type: string, format: date-time }
        knownServerRevision: { type: [integer, 'null'] }
        payloadJson: { type: string }
        dependencyIds:
          type: array
          items: { type: string, format: uuid }
    OperationResult:
      type: object
      required: [clientOperationId, accepted, conflict]
      properties:
        clientOperationId: { type: string, format: uuid }
        accepted: { type: boolean }
        conflict: { type: boolean }
        canonicalEntityId: { type: [string, 'null'], format: uuid }
        canonicalRevision: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        serverStateJson: { type: [string, 'null'] }
